<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notifications — Herae</title>
<meta name="robots" content="noindex">
<meta name="herae-memories-site" content="1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="h2.css">
<style>
  /* The bell's page (founder 10-22): everything that happened to you, newest first; unread ones stand out. */
  body { margin: 0; min-height: 100dvh; }
  .nt { max-width: 640px; margin: 0 auto; }
  .nt h1 { margin: 8px 0 18px; }
  .nt-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .nt-item a { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; text-decoration: none; color: var(--h-text);
    background: var(--h-surface); border: 1px solid var(--h-line); transition: border-color .15s ease, transform .12s ease; }
  .nt-item a:hover { border-color: var(--h-line-strong); } .nt-item a:active { transform: scale(.99); }
  .nt-item.unread a { background: linear-gradient(135deg, rgba(99, 102, 241, .16), rgba(236, 72, 153, .12)); border-color: rgba(167, 139, 250, .45); }
  .nt-ico { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: var(--h-surface-2); }
  .nt-item.unread .nt-ico { background: linear-gradient(135deg, #6366F1, #A78BFA 52%, #EC4899); }
  .nt-body { flex: 1; min-width: 0; }
  .nt-text { display: block; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
  .nt-item.unread .nt-text { font-weight: 700; }
  .nt-time { display: block; margin-top: 3px; font-size: 12.5px; color: var(--h-text-3); }
  .nt-dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #EC4899; }
  @media (max-width: 640px) { main.h-page { padding-bottom: 96px; } }
</style>
</head>
<body class="h2">
  <header class="h-topbar"><a class="h-brand" href="memories.html" aria-label="herae — home"><img src="herae-logo-on-dark.svg" alt="herae" height="26"></a></header>
  <main class="h-page" id="main">
    <section class="nt" aria-labelledby="ntTitle">
      <h1 id="ntTitle">Notifications</h1>
      <div id="ntBody"><div class="h-skeleton" style="height:240px" aria-hidden="true"></div></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app-nav.js"></script>
  <script>
  requireAuth();
  (async () => {
    const ICON = { match: '💞', yes: '👀', message: '💬', friend: '🤝', proposal: '🎬', party_request: '🙋', party_in: '🎉', like: '❤️', comment: '💭' };
    const ago = (t) => { const s = Math.max(0, (Date.now() - Date.parse(String(t).replace(' ', 'T') + 'Z')) / 1000);
      return s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`; };
    const body = document.getElementById('ntBody');
    let r; try { r = await apiRequest('/api/notifications'); } catch (e) { body.textContent = e.message || 'Could not load your notifications.'; return; }
    body.innerHTML = '';
    if (!r.items.length) {
      const empty = document.createElement('div'); empty.className = 'h-empty h-stack';
      empty.innerHTML = '<h2>Nothing yet</h2><p>Matches, messages, people who want to watch with you and party news will show up here.</p><a class="hb hb-primary" href="social.html#discover">Find someone to watch with</a>';
      body.append(empty);
    } else {
      const ul = document.createElement('ul'); ul.className = 'nt-list';
      for (const it of r.items) {
        const li = document.createElement('li'); li.className = 'nt-item' + (it.unread ? ' unread' : '');
        const a = document.createElement('a'); a.href = it.href;
        const ico = document.createElement('span'); ico.className = 'nt-ico'; ico.setAttribute('aria-hidden', 'true'); ico.textContent = ICON[it.kind] || '🔔';
        const b = document.createElement('span'); b.className = 'nt-body';
        const t = document.createElement('span'); t.className = 'nt-text'; t.textContent = it.text;   // text only: names and messages are user content
        const tm = document.createElement('span'); tm.className = 'nt-time'; tm.textContent = ago(it.at);
        b.append(t, tm); a.append(ico, b);
        if (it.unread) { const d = document.createElement('span'); d.className = 'nt-dot'; d.setAttribute('aria-label', 'New'); a.append(d); }
        li.append(a); ul.append(li);
      }
      body.append(ul);
    }
    // Opening the page is "seen" (the bell's badge clears); unread messages stay highlighted until read in the chat.
    apiRequest('/api/notifications/seen', { method: 'POST' }).then(() => { if (window.heraeNavBadges) window.heraeNavBadges(); }).catch(() => {});
  })();
  </script>
</body>
</html>
