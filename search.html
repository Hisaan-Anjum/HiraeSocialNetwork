<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="herae-memories-site" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herae Memories — Search</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">

  <meta name="description" content="Find something to watch together tonight. Browse films and shows you can sync with Herae.">

  <link rel="canonical" href="https://herae.app/search.html">
  <meta name="robots" content="index, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Herae">
  <meta property="og:url" content="https://herae.app/search.html">
  <meta property="og:title" content="Search Films & Shows — Herae">
  <meta property="og:description" content="Find something to watch together tonight. Browse films and shows you can sync with Herae.">
  <meta property="og:image" content="https://herae.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Search Films & Shows — Herae">
  <meta name="twitter:description" content="Find something to watch together tonight. Browse films and shows you can sync with Herae.">
  <meta name="twitter:image" content="https://herae.app/og-image.png">
</head>
<body>
  <div class="topbar">
    <a class="brand-link" href="memories.html" aria-label="Herae Memories — home">
      <img src="logo.png" alt="Herae" class="brand-logo">
      <span class="brand-sub">Search</span>
    </a>
    <nav class="nav-links">
      <a href="memories.html" class="nav-link">Feed</a>
      <a href="contacts.html" class="nav-link">Contacts</a>
    </nav>
    <div class="topbar-right">
      <span class="who" id="whoAmI"></span>
      <button class="btn btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="page-wrap" style="max-width:760px">
    <form id="searchForm" class="search-page-bar">
      <input type="search" id="searchInput" placeholder="Search people, sessions, reviews, moments, movies…" autocomplete="off">
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <!-- Result types as tabs rather than five stacked sections. Stacked, a
         match in Movies could sit several screens below People and be missed
         entirely, and the page length varied wildly with what happened to
         match. Counts live on the tabs so everything found is visible at a
         glance without scrolling. "All" keeps the old stacked view as the
         default, so nothing is lost — it just isn't the only option. -->
    <div class="search-tabs" id="searchTabs" role="tablist" hidden>
      <button type="button" class="search-tab is-active" data-tab="all" role="tab" aria-selected="true">All</button>
      <button type="button" class="search-tab" data-tab="users" role="tab" aria-selected="false">People <span class="search-tab-n" data-n hidden></span></button>
      <button type="button" class="search-tab" data-tab="sessions" role="tab" aria-selected="false">Sessions <span class="search-tab-n" data-n hidden></span></button>
      <button type="button" class="search-tab" data-tab="reviews" role="tab" aria-selected="false">Reviews <span class="search-tab-n" data-n hidden></span></button>
      <button type="button" class="search-tab" data-tab="moments" role="tab" aria-selected="false">Moments <span class="search-tab-n" data-n hidden></span></button>
      <button type="button" class="search-tab" data-tab="movies" role="tab" aria-selected="false">Movies <span class="search-tab-n" data-n hidden></span></button>
    </div>

    <div id="results">
      <section class="search-group" id="group-users" hidden>
        <h2 class="search-group-title">People <span class="pill-count" data-count></span></h2>
        <div class="contacts-list" data-items></div>
        <button class="btn btn-ghost btn-sm search-more-users" hidden>Show more people</button>
      </section>
      <section class="search-group" id="group-sessions" hidden>
        <h2 class="search-group-title">Sessions <span class="pill-count" data-count></span></h2>
        <div class="feed-list" data-items></div>
      </section>
      <section class="search-group" id="group-reviews" hidden>
        <h2 class="search-group-title">Reviews <span class="pill-count" data-count></span></h2>
        <div data-items></div>
      </section>
      <section class="search-group" id="group-moments" hidden>
        <h2 class="search-group-title">Moments <span class="pill-count" data-count></span></h2>
        <div class="search-moments-grid" data-items></div>
      </section>
      <section class="search-group" id="group-movies" hidden>
        <h2 class="search-group-title">Movies <span class="pill-count" data-count></span></h2>
        <!-- Filter bar mounts here (components/movieFilters.js). Movies are the
             one result type worth filtering — the catalogue runs to thousands,
             where contacts and your own sessions do not. -->
        <div id="movieFilters"></div>
        <div class="feed-list" data-items></div>
      </section>
      <div id="searchEmpty" hidden></div>
    </div>
    <div id="scrollSentinel" class="scroll-sentinel"></div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script type="module" src="/src/pages/searchResults.js"></script>
</body>
</html>
