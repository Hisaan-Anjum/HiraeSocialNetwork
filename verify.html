<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="herae-memories-site" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm your email — Herae</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">

  <meta name="description" content="Verify your Herae email address.">

  <link rel="canonical" href="https://herae.app/verify.html">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Herae">
  <meta property="og:url" content="https://herae.app/verify.html">
  <meta property="og:title" content="Verify your email — Herae">
  <meta property="og:description" content="Verify your Herae email address.">
  <meta property="og:image" content="https://herae.app/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Verify your email — Herae">
  <meta name="twitter:description" content="Verify your Herae email address.">
  <meta name="twitter:image" content="https://herae.app/og-image.png">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="herae-symbol.svg" alt="Herae" class="login-logo">
      <div class="login-title" id="title">Confirming your email…</div>
      <div class="login-sub" id="message">One moment.</div>
      <div class="login-hint" id="cta" style="display:none">
        <a href="login.html">Continue to Herae →</a>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    // Verifies as soon as the page loads, using the token from the email link.
    // From 11-13 a new account's second free night waits on it (server subscriptions.unverified), so a failure
    // here (expired/used link) offers a resend right on this page.
    const token = new URLSearchParams(location.search).get('token') || '';
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const cta = document.getElementById('cta');
    // No token (the extension's "Verify your email to keep your free nights", 11-12), or a dead link: offer a resend.
    const T = /^ru/i.test(navigator.language || '')
      ? { t: 'Подтвердите почту', m: 'Подтвердите почту, чтобы сохранить бесплатные вечера. Ссылка в письме от Herae.', b: 'Отправить письмо ещё раз', sent: 'Отправили. Проверьте почту и папку «Спам».' }
      : { t: 'Verify your email', m: 'Verify your email to keep your free nights. The link is in the email from Herae.', b: 'Resend the email', sent: 'Sent. Check your inbox and spam folder.' };
    function offerResend(note) {
      title.textContent = T.t;
      message.textContent = (note ? note + ' ' : '') + T.m;
      if (!getAuth()) return;   // signed out: the "Continue to Herae" link signs them in first
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary'; btn.textContent = T.b;
      btn.onclick = async () => {
        btn.disabled = true;
        try { await apiRequest('/api/verify-email/resend', { method: 'POST' }); message.textContent = T.sent; } catch (e) { message.textContent = e.message; btn.disabled = false; }
      };
      cta.replaceChildren(btn);
    }

    (async () => {
      if (!token) {
        offerResend();
        cta.style.display = 'block';
        return;
      }
      try {
        const res = await fetch('/api/verify-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not confirm your email.');
        title.textContent = 'Email confirmed';
        message.textContent = 'Thanks — your email is verified.';
      } catch (err) {
        offerResend(err.message);
      } finally {
        cta.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
