<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>People — Herae</title>
<meta name="robots" content="noindex">
<meta name="herae-memories-site" content="1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">

<link rel="stylesheet" href="h2.css">
<style>
  body { margin: 0; min-height: 100dvh; }
  .s-tabs { display: flex; gap: var(--h-1); padding: 0 max(var(--h-4), calc((100vw - 1120px) / 2)); border-bottom: 1px solid var(--h-line); position: sticky; top: 60px; background: var(--h-bg); z-index: 5; }
  .s-tab { position: relative; min-height: var(--h-tap); padding: 0 var(--h-4); background: none; border: 0; color: var(--h-text-2); font: 600 var(--h-size-sm) var(--h-font-body); cursor: pointer; border-bottom: 2px solid transparent; }
  .s-tab[aria-selected="true"] { color: var(--h-text); border-bottom-color: var(--h-accent); }
  .s-badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--h-coral); color: #1b0d09; font-size: 11px; line-height: 18px; text-align: center; }
  .s-badge[hidden] { display: none; }
  .s-tab { white-space: nowrap; }
  @media (max-width: 640px) {
    /* phones: the global bottom bar is the main nav; these become a row of pills under the header */
    .s-tabs { top: 56px; gap: 8px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--h-line); }
    .s-tabs::-webkit-scrollbar { display: none; }
    .s-tabs { gap: 6px; padding: 10px 12px; }
    .s-tab { min-height: 36px; padding: 0 12px; border: 1px solid var(--h-line-strong); border-radius: 999px; font-size: 14px; }
    .s-tab[aria-selected="true"] { background: #F8FAFC; color: #0F172A; border-color: #F8FAFC; }
    main.h-page { padding-bottom: 96px; }
  }
  /* deck */
  #v-discover { overflow-x: clip; }   /* a card mid-swipe must not make the page scroll sideways */
  /* ── Discover: one tall card at a time, Tinder-style (founder 10-22: "beautiful, elegant, modern, addictive") ── */
  /* the column has a fixed height and the card takes whatever the teaser and the buttons leave, so the buttons never
     slip under the phone's bottom bar */
  .dz { max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-top: 4px; height: clamp(480px, calc(100dvh - 300px), 790px); }   /* 300: header + tabs + the desktop dock (app-nav.js) */
  .dz-stack { position: relative; flex: 1 1 auto; min-height: 0; }
  .dz-actions, .dz-tease { flex: none; }
  @media (max-width: 640px) { .dz { gap: 14px; height: max(480px, calc(100dvh - 56px - 57px - 64px - 44px)); } }
  .d-card { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; background: #0B1022; color: #fff;
    box-shadow: 0 24px 60px -12px rgba(2, 6, 23, .7), 0 0 0 1px rgba(255, 255, 255, .07);
    touch-action: pan-y; user-select: none; -webkit-user-select: none; outline: none;
    transition: transform .32s cubic-bezier(.2, .8, .2, 1), opacity .32s ease; will-change: transform; }
  .d-card:focus-visible { box-shadow: 0 24px 60px -12px rgba(2, 6, 23, .7), 0 0 0 3px #A78BFA; }
  .d-card.dragging { transition: none; }
  .d-card.behind { transform: scale(.94) translateY(16px); opacity: .5; pointer-events: none; }
  .d-card.enter { animation: dIn .34s cubic-bezier(.2, .8, .2, 1); }
  @keyframes dIn { from { transform: scale(.94) translateY(16px); opacity: .5; } }
  .d-media { position: absolute; inset: 0; cursor: pointer; }
  .d-media img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
  .d-bars { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; gap: 4px; z-index: 2; }
  .d-bars i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .35); }
  .d-bars i.on { background: #fff; box-shadow: 0 0 6px rgba(255, 255, 255, .5); }
  /* no visible photo: an aurora in the brand colours, their initial, and their films set like a poster */
  .d-art { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(110% 70% at 0% 0%, rgba(99, 102, 241, .95), transparent 62%),
      radial-gradient(90% 60% at 100% 22%, rgba(236, 72, 153, .8), transparent 60%),
      radial-gradient(90% 60% at 30% 70%, rgba(167, 139, 250, .55), transparent 62%), #0F172A; }
  .d-reel { position: absolute; left: -20%; right: -20%; top: 6%; display: flex; flex-direction: column; gap: 4px; transform: rotate(-9deg);
    font: 800 34px/1 var(--h-font-display); letter-spacing: -.01em; text-transform: uppercase; white-space: nowrap; color: #fff; opacity: .13; }
  .d-initial { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); width: 148px; height: 148px; border-radius: 50%;
    display: grid; place-items: center; font: 800 68px/1 var(--h-font-display); color: #fff;
    background: rgba(255, 255, 255, .14); border: 1.5px solid rgba(255, 255, 255, .35); box-shadow: 0 20px 50px rgba(15, 23, 42, .35), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .d-shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(2, 6, 23, .45) 0%, rgba(2, 6, 23, 0) 16%, rgba(2, 6, 23, 0) 42%, rgba(2, 6, 23, .72) 70%, rgba(2, 6, 23, .96) 100%); }
  .d-more { position: absolute; top: 20px; right: 12px; z-index: 3; }
  .d-more > .rel > .hb { width: 36px; height: 36px; min-height: 36px; padding: 0; border-radius: 50%; border: 0; color: #fff; font-size: 18px; line-height: 1;
    background: rgba(15, 23, 42, .38); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .d-info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 0 20px 22px; }
  .d-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .d-badge { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 5px 11px 5px 9px; border-radius: 999px;
    font: 700 12.5px/1.2 var(--h-font-body); letter-spacing: .005em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: rgba(30, 41, 59, .72); border: 1px solid rgba(255, 255, 255, .16); }
  .d-badge.hot { background: linear-gradient(135deg, #6366F1, #A78BFA 55%, #EC4899); border-color: transparent; box-shadow: 0 6px 18px -4px rgba(236, 72, 153, .55); }
  .d-badge svg { width: 14px; height: 14px; flex: none; }
  .d-name { display: flex; align-items: flex-end; gap: 12px; }
  /* Premium members (founder 10-24): a gold ring around the card and a gold pill beside the name, with a slow shine. */
  .d-card.premium { box-shadow: 0 0 0 2px rgba(251, 191, 36, .85), 0 0 28px rgba(251, 191, 36, .35), 0 18px 48px rgba(2, 6, 23, .55); }
  .d-premium { align-self: center; flex: none; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .04em;
    color: #3B2300; background: linear-gradient(110deg, #F59E0B 0%, #FDE68A 45%, #FFF7D6 50%, #FDE68A 55%, #F59E0B 100%); background-size: 250% 100%;
    box-shadow: 0 2px 10px rgba(245, 158, 11, .45); animation: d-shine 3.2s ease-in-out infinite; }
  @keyframes d-shine { 0%, 60% { background-position: 100% 0; } 100% { background-position: -150% 0; } }
  @media (prefers-reduced-motion: reduce) { .d-premium { animation: none; } }
  .d-card h2 { flex: 1; min-width: 0; margin: 0; font: 800 34px/1.02 var(--h-font-display); letter-spacing: -.025em; color: #fff;
    text-shadow: 0 2px 18px rgba(2, 6, 23, .5); overflow-wrap: anywhere; }
  .d-infob { flex: none; width: 38px; height: 38px; margin-bottom: 1px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .28); background: rgba(255, 255, 255, .14);
    color: #fff; display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .d-infob svg { width: 18px; height: 18px; }
  .d-infob:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .d-sub { display: flex; align-items: center; gap: 6px; margin-top: 6px; font: 600 13px/1.3 var(--h-font-body); color: rgba(255, 255, 255, .78); }
  .d-sub svg { width: 15px; height: 15px; flex: none; }
  .d-bio { margin: 10px 0 0; font: 500 15px/1.45 var(--h-font-body); color: rgba(255, 255, 255, .94);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .d-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; max-height: 64px; overflow: hidden; }
  .d-chip { padding: 5px 12px; border-radius: 999px; font: 600 12.5px/1.3 var(--h-font-body); color: #fff; white-space: nowrap;
    background: rgba(15, 23, 42, .55); border: 1px solid rgba(255, 255, 255, .22); }
  .d-stamp { position: absolute; top: 46px; z-index: 4; padding: 6px 14px 5px; border: 4px solid currentColor; border-radius: 14px;
    font: 900 32px/1 var(--h-font-display); letter-spacing: .06em; text-transform: uppercase; opacity: 0; pointer-events: none; background: rgba(2, 6, 23, .18); }
  .d-stamp.yes { left: 22px; color: #4ADE80; transform: rotate(-14deg); }
  .d-stamp.no { right: 22px; color: #FB7185; transform: rotate(14deg); }
  .dz-tease { margin: 0; align-self: center; display: inline-flex; gap: 6px; padding: 7px 14px; border-radius: 999px; font: 700 13px/1.2 var(--h-font-body); color: #fff;
    background: linear-gradient(135deg, rgba(99, 102, 241, .28), rgba(236, 72, 153, .28)); border: 1px solid rgba(236, 72, 153, .45); }
  .dz-actions { display: flex; justify-content: center; align-items: center; gap: 20px; }
  .dz-btn { width: 54px; height: 54px; flex: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0;
    border: 1px solid rgba(255, 255, 255, .09); background: linear-gradient(180deg, #172036, #0F172A); box-shadow: 0 10px 24px -6px rgba(2, 6, 23, .8), inset 0 1px 0 rgba(255, 255, 255, .06);
    transition: transform .14s ease, box-shadow .2s ease; -webkit-tap-highlight-color: transparent; }
  .dz-btn svg { width: 24px; height: 24px; }
  .dz-btn.lg { width: 70px; height: 70px; } .dz-btn.lg svg { width: 32px; height: 32px; }
  .dz-btn.undo { color: #FBBF24; } .dz-btn.info { color: #60A5FA; } .dz-btn.no { color: #FB7185; }
  .dz-btn.yes { color: #fff; border: 0; background: linear-gradient(135deg, #6366F1, #A78BFA 52%, #EC4899); box-shadow: 0 14px 30px -8px rgba(236, 72, 153, .6), inset 0 1px 0 rgba(255, 255, 255, .3); }
  .dz-btn:active { transform: scale(.88); }
  .dz-btn:focus-visible { outline: 3px solid #A78BFA; outline-offset: 3px; }
  @media (hover: hover) { .dz-btn:hover { transform: translateY(-2px) scale(1.05); } .dz-btn.no:hover { box-shadow: 0 12px 28px -6px rgba(251, 113, 133, .5); } }
  .pt-filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 var(--h-3); }
  @media (max-width: 640px) { .pt-filters { grid-template-columns: 1fr 1fr; } .pt-filters select:last-child { grid-column: 1 / -1; } }
  /* the match moment */
  .mt { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(80% 60% at 50% 30%, rgba(99, 102, 241, .55), transparent 70%), radial-gradient(60% 50% at 80% 90%, rgba(236, 72, 153, .45), transparent 70%), rgba(2, 6, 23, .97);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); animation: mtIn .35s ease; }
  @keyframes mtIn { from { opacity: 0; } }
  .mt-in { position: relative; z-index: 1; width: min(400px, 100% - 40px); text-align: center; color: #fff; }
  .mt-kicker { margin: 0 0 6px; font: 700 12px/1 var(--h-font-body); letter-spacing: .18em; text-transform: uppercase; color: rgba(255, 255, 255, .7); }
  .mt h2 { margin: 0; font: 900 italic 54px/1.02 var(--h-font-display); letter-spacing: -.03em; transform: rotate(-3deg);
    background: linear-gradient(135deg, #C7D2FE, #F0ABFC 50%, #F9A8D4); -webkit-background-clip: text; background-clip: text; color: transparent; animation: mtPop .5s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes mtPop { from { transform: rotate(-3deg) scale(.6); opacity: 0; } }
  .mt-pair { display: flex; justify-content: center; align-items: center; margin: 30px 0 22px; }
  .mt-pair .h-avatar { width: 112px; height: 112px; font-size: 42px; border: 4px solid #fff; box-shadow: 0 18px 40px rgba(2, 6, 23, .6); }
  .mt-pair .h-avatar:first-child { transform: rotate(-6deg); } .mt-pair .h-avatar:last-child { transform: rotate(6deg); margin-left: -18px; }
  .mt-heart { position: relative; z-index: 1; width: 44px; height: 44px; margin: 0 -14px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, #6366F1, #EC4899); box-shadow: 0 8px 24px rgba(236, 72, 153, .6); animation: mtBeat 1.2s ease-in-out infinite; }
  .mt-heart svg { width: 22px; height: 22px; }
  @keyframes mtBeat { 50% { transform: scale(1.14); } }
  .mt-in > p { margin: 0 0 26px; font: 500 16px/1.5 var(--h-font-body); color: rgba(255, 255, 255, .86); }
  .mt-actions { display: flex; flex-direction: column; gap: 10px; }
  .mt-actions .hb { width: 100%; min-height: 52px; font-size: 16px; border-radius: 999px; }
  .mt-actions .hb-primary { background: linear-gradient(135deg, #6366F1, #A78BFA 52%, #EC4899); border: 0; color: #fff; }
  .mt-fx { position: absolute; inset: 0; pointer-events: none; }
  .mt-fx i { position: absolute; top: -16px; width: 8px; height: 14px; border-radius: 2px; animation: mtFall linear forwards; }
  @keyframes mtFall { to { transform: translate3d(var(--dx), 110vh, 0) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .d-card, .dz-btn { transition: none; } .d-card.enter, .mt, .mt h2, .mt-heart { animation: none; } .mt-fx { display: none; } }
  .d-meta { margin: 0; } .d-meta dt { font: 700 11.5px/1.2 var(--h-font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--h-text-3); margin-top: 14px; }
  .d-meta dt:first-child { margin-top: 0; } .d-meta dd { margin: 4px 0 0; font-size: 15px; line-height: 1.45; }
  .d-page { display: inline-block; margin-top: 16px; font-weight: 700; }
  .d-tut-in { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 28px 24px; color: #fff; }
  .d-tut-in h2 { margin: 0; font: 800 30px/1.1 var(--h-font-display); letter-spacing: -.02em; }
  .d-tut-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .d-tut-row span { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 16px; background: rgba(15,23,42,.55); border: 1px solid rgba(255,255,255,.14); }
  .d-tut-row i { font-style: normal; font-size: 26px; } .d-tut-row b { font-size: 15px; } .d-tut-row small { font-size: 12.5px; color: rgba(255,255,255,.75); }
  .d-tut-in p { margin: 0; font-size: 14.5px; line-height: 1.5; color: rgba(255,255,255,.9); }
  .d-tut-go { font-weight: 700; color: #F9A8D4 !important; }
  .dlg-x { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--h-surface-2); color: var(--h-text); font-size: 16px; cursor: pointer; }
  .dlg-x:hover { background: var(--h-surface-3); } #dlg { position: relative; } #dlg h2 { padding-right: 44px; }
  /* Matches: new matches as a row of faces, then the list */
  .mx-new { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 16px; scrollbar-width: none; }
  .mx-new::-webkit-scrollbar { display: none; }
  .mx-new a { flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--h-text); font: 600 13px var(--h-font-body); }
  .mx-new a span:last-child { max-width: 84px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mx-new .h-avatar { width: 76px; height: 76px; font-size: 28px; padding: 3px; box-sizing: border-box;
    background: linear-gradient(#0F172A, #0F172A) padding-box, linear-gradient(135deg, #6366F1, #A78BFA 52%, #EC4899) border-box; border: 3px solid transparent; }
  .mx-h { font: 700 13px var(--h-font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--h-text-3); margin: 14px 0 10px; }
  /* chat — a messenger: compact header, bubbles, one slim composer row */
  .c-view { display: flex; flex-direction: column; min-height: calc(100dvh - 140px); }
  .c-head { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: var(--h-3); padding: var(--h-2) 0; background: var(--h-bg); border-bottom: 1px solid var(--h-line); }
  .c-head .c-back { width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 50%; font-size: 20px; }
  .c-head .h-avatar { width: 40px; height: 40px; font-size: 16px; }
  .c-who { flex: 1; min-width: 0; } .c-who b { display: block; font-size: var(--h-size-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-who span { font-size: var(--h-size-xs); color: var(--h-text-3); }
  .c-thread { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: var(--h-4) 0; }
  .c-msg { max-width: min(78%, 520px); padding: 9px 14px 7px; border-radius: 20px; border-bottom-left-radius: 6px; background: var(--h-surface-2); color: var(--h-text); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
  .c-msg.mine { align-self: flex-end; background: #4F46E5; color: #fff; border-radius: 20px; border-bottom-right-radius: 6px; }
  .c-msg.failed { outline: 2px solid var(--h-danger); }
  .c-msg time { display: block; font-size: 11px; opacity: .7; margin-top: 2px; text-align: right; }
  .c-sys { align-self: center; font-size: var(--h-size-xs); color: var(--h-text-3); padding: 4px 10px; }
  .c-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--h-3); padding: var(--h-6) 0; }
  .c-empty .h-avatar { width: 72px; height: 72px; font-size: 28px; }
  .h-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .ph-strip { display: grid; grid-auto-flow: column; grid-auto-columns: min(78vw, 360px); gap: var(--h-3); overflow-x: auto; scroll-snap-type: x mandatory; }
  .ph-strip img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--h-r-lg); scroll-snap-align: start; }
  .c-empty h2 { font-size: var(--h-size-lg); margin: 0; } .c-empty p { margin: 0; color: var(--h-text-3); font-size: var(--h-size-sm); }
  .c-starters { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--h-2); }
  .c-compose { position: sticky; bottom: 0; display: flex; align-items: flex-end; gap: var(--h-2); padding: var(--h-2) 0 calc(var(--h-2) + env(safe-area-inset-bottom)); background: var(--h-bg); border-top: 1px solid var(--h-line); }
  .c-compose textarea { flex: 1; min-height: 44px; max-height: 128px; resize: none; padding: 11px 16px; border-radius: 22px; background: var(--h-surface-2); border: 1px solid var(--h-line-strong); color: var(--h-text); font: var(--h-size-md)/1.35 var(--h-font-body); box-sizing: border-box; }
  .c-compose textarea:focus-visible { outline: none; border-color: var(--h-focus); }
  .c-ico { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--h-line-strong); background: var(--h-surface-2); color: var(--h-text); font-size: 19px; cursor: pointer; display: grid; place-items: center; }
  .c-ico.send { background: #4F46E5; border-color: #4F46E5; color: #fff; }
  .c-ico:disabled { opacity: .45; cursor: default; }
  .c-ico svg { width: 20px; height: 20px; }
  /* inside a conversation on a phone the bottom tabs give their space to the chat */
  @media (max-width: 640px) { body.in-thread .s-tabs { display: none; } body.in-thread .c-view { min-height: calc(100dvh - 72px); } }
  .row-main { flex: 1; min-width: 0; }
  .row-main strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tap-row { cursor: pointer; }
  .row-main .sub { font-size: var(--h-size-sm); color: var(--h-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .new-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--h-coral); flex: none; }
  menu.h-menu { position: absolute; right: 0; top: 100%; margin: 4px 0 0; padding: var(--h-1); list-style: none; background: var(--h-surface-2); border: 1px solid var(--h-line-strong); border-radius: var(--h-r-md); z-index: 10; min-width: 180px; }
  menu.h-menu button { display: block; width: 100%; text-align: left; min-height: 40px; padding: 0 var(--h-3); background: none; border: 0; color: var(--h-text); font: var(--h-size-sm) var(--h-font-body); cursor: pointer; border-radius: var(--h-r-sm); }
  menu.h-menu button:hover, menu.h-menu button:focus-visible { background: var(--h-surface-3); }
  menu.h-menu button.danger { color: var(--h-danger); }

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="film-pick.js"></script>
<script src="app-nav.js"></script>
  <script>
  requireAuth();
  (() => {
    const $ = (id) => document.getElementById(id);
    const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v); }
      for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
      return e; };
    const me = (getAuth() || {}).username;
    const announce = (t) => { $('live').textContent = ''; setTimeout(() => { $('live').textContent = t; }, 30); };
    let toastTimer;
    const toast = (t) => { document.querySelectorAll('.h-toast').forEach((x) => x.remove()); const x = el('div', { class: 'h-toast', role: 'status' }, t); document.body.append(x); clearTimeout(toastTimer); toastTimer = setTimeout(() => x.remove(), 3500); };
    // Buddy photos are private: ask once per person what this viewer may see, then show the main photo in place of
    // the letter avatar. Strangers get { locked: true } and never an image.
    const photoInfo = new Map();
    const photosOf = (u) => { if (!photoInfo.has(u)) photoInfo.set(u, apiRequest(`/api/photos/of/${encodeURIComponent(u)}`).catch(() => ({ photos: [], count: 0, locked: true }))); return photoInfo.get(u); };
    function photoAvatar(username, person) {
      const a = avatar(person);
      photosOf(username).then(async (r) => { if (!r.photos.length) return; const src = await apiImage(r.photos[0].url); if (!src) return;
        a.textContent = ''; a.removeAttribute('aria-hidden'); const img = document.createElement('img'); img.src = src; img.alt = ''; a.append(img); });
      return a;
    }
    async function showPhotos(username, name) {
      const r = await photosOf(username);
      if (!r.photos.length) { toast(r.locked ? `${name}’s photos are private for now.` : `${name} hasn’t added photos yet.`); return; }
      const srcs = await Promise.all(r.photos.map((p) => apiImage(p.url)));
      const strip = el('div', { class: 'ph-strip' }, ...srcs.filter(Boolean).map((src, i) => el('img', { src, alt: `${name}, photo ${i + 1}` })));
      dialog(`${name}`, [strip], [['Close', 'hb-primary', false]]);
    }
    const avatar = (p) => p.avatarUrl ? el('span', { class: 'h-avatar' }, el('img', { src: p.avatarUrl, alt: '' })) : el('span', { class: 'h-avatar', 'aria-hidden': 'true' }, (p.name || p.username || '?')[0].toUpperCase());
    const LABEL = { weekday_evenings: 'Weekday evenings', weekend_days: 'Weekend days', weekend_evenings: 'Weekend evenings', late_nights: 'Late nights', flexible: 'Flexible',
      one_to_one: 'One-to-one', small_group: 'A few friends', big_party: 'Big parties', quiet_watcher: 'Quiet watcher', commentator: 'Running commentary', rewatcher: 'Rewatcher',
      binger: 'Binger', one_episode: 'One episode a night', night_owl: 'Night owl', subtitles_on: 'Subtitles always', cries_at_films: 'Cries at films', gaming: 'Gaming', reading: 'Reading', fitness: 'Fitness', travel: 'Travel', cooking: 'Cooking', music_making: 'Making music', art: 'Art', outdoors: 'Outdoors', cafes: 'Cafés', pets: 'Pets', sports: 'Sports', photography: 'Photography', student: 'Student', tech: 'Tech', healthcare: 'Healthcare', education: 'Education', business: 'Business', creative: 'Creative', engineering: 'Engineering', law: 'Law', hospitality: 'Hospitality', trades: 'Trades', public_service: 'Public service', other: 'Something else', homebody: 'Homebody', adventurous: 'Adventurous', deep_talks: 'Loves deep talks', jokester: 'Jokester', calm: 'Calm', chatty: 'Chatty', romantic: 'Romantic', curious: 'Curious', planner: 'Planner', spontaneous: 'Spontaneous', snack_first: 'Snacks first', pauses_to_discuss: 'Pauses to discuss' };
    // Tapping anywhere on a list row opens it (people tap the name, not the small button); the button stays for keyboards.
    const rowGo = (hash) => (e) => { if (!e.target.closest('a, button, menu')) location.hash = hash; };
    const L = (xs) => (xs || []).map((x) => LABEL[x] || x).join(', ');
    const when = (s) => { const d = new Date(String(s).replace(' ', 'T') + (String(s).includes('Z') ? '' : 'Z')); return isNaN(d) ? '' : d.toLocaleString(undefined, { hour: 'numeric', minute: '2-digit', month: 'short', day: 'numeric' }); };

    // The extension hand-off (content.js __heraeStartSession). Resolves { handled:false } when no extension answers.
    const handOff = (payload) => new Promise((resolve) => {
      let done = false; const finish = (v) => { if (!done) { done = true; window.removeEventListener('message', on); resolve(v); } };
      function on(e) { if (e.source === window && e.data && e.data.__heraeStartSessionAck === true) finish({ handled: true, error: e.data.error, busy: e.data.busy }); }
      window.addEventListener('message', on);
      window.postMessage({ __heraeStartSession: true, url: '', title: '', ...payload }, location.origin);
      setTimeout(() => finish({ handled: false }), 1200);
    });
    // Which extension version is here (null = none). Party hand-offs need 2.7.27+; older ones would send an invite instead.
    const extVersion = new Promise((resolve) => {
      const on = (e) => { if (e.source === window && e.data && e.data.__heraeExtension === true) { window.removeEventListener('message', on); resolve(String(e.data.version || '0')); } };
      window.addEventListener('message', on); window.postMessage({ __heraePing: true }, location.origin); setTimeout(() => resolve(null), 1500);
    });
    const atLeast = (v, min) => { const a = v.split('.').map(Number); const b = min.split('.').map(Number);
      for (let i = 0; i < 3; i++) if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0); return true; };
    async function needExtension(why) {
      const go = await dialog('Herae needs to be in Chrome on this computer', el('p', { class: 'muted' }, why), [['Not now', 'hb-quiet', false], ['Add Herae to Chrome', 'hb-primary', true]]);
      if (go) window.open('https://chromewebstore.google.com/detail/kadhimjoddiaenogicbdnejoabdiimgn?utm_source=social', '_blank', 'noopener');
    }

    // Today's messages show just the time; older ones the date too.
    const msgTime = (s) => { const d = new Date(String(s).replace(' ', 'T') + (String(s).includes('Z') ? '' : 'Z')); if (isNaN(d)) return '';
      return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : when(s); };
    // Click outside the box or the ✕ closes it (founder 10-23).
    $('dlg').addEventListener('click', (e) => { if (e.target !== $('dlg')) return; const r = $('dlg').getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) $('dlg').close(); });
    $('dlgClose').onclick = () => $('dlg').close();
    function dialog(title, body, actions) {
      $('dlgTitle').textContent = title; const b = $('dlgBody'); b.innerHTML = ''; b.append(...[].concat(body));
      const a = $('dlgActions'); a.innerHTML = '';
      return new Promise((resolve) => {
        for (const [label, cls, val] of actions) a.append(el('button', { type: 'button', class: `hb ${cls}`, onclick: () => { $('dlg').close(); resolve(val); } }, label));
        $('dlg').onclose = () => resolve(null); $('dlg').showModal();
      });
    }
    // Report and block, reachable from every person surface.
    async function reportPerson(username, type = 'user', id = null) {
      const reasons = [['harassment', 'Harassment or bullying'], ['spam', 'Spam or scam'], ['impersonation', 'Pretending to be someone'], ['privacy', 'Shared private information'], ['threat', 'Threats or violence'], ['inappropriate', 'Inappropriate content'], ['other', 'Something else']];
      const sel = el('select', { class: 'hi', id: 'rsn', 'aria-label': 'Reason' }, ...reasons.map(([v, t]) => el('option', { value: v }, t)));
      const det = el('textarea', { class: 'hi', id: 'rdet', maxlength: '1000', placeholder: 'Anything that helps (optional)', 'aria-label': 'Details' });
      const blockToo = el('input', { type: 'checkbox', id: 'rblk', checked: true, style: 'width:20px;height:20px;accent-color:var(--h-accent)' });
      const ok = await dialog(`Report ${username}`, [el('div', { class: 'h-stack' }, sel, det, el('label', { class: 'h-row' }, blockToo, el('span', {}, `Also block ${username}`)), el('p', { class: 'h-help' }, 'Reports are reviewed by the Herae team. We don’t tell them who reported.'))], [['Cancel', 'hb-quiet', false], ['Send report', 'hb-danger', true]]);
      if (!ok) return false;
      try {
        await apiRequest('/api/safety/reports', { method: 'POST', body: JSON.stringify({ username, type, id, reason: sel.value, details: det.value }) });
        if (blockToo.checked) await apiRequest('/api/safety/blocks', { method: 'POST', body: JSON.stringify({ username }) });
        toast(blockToo.checked ? `Reported and blocked ${username}.` : 'Report sent. Thank you.'); return true;
      } catch (e) { toast(e.message || 'Could not send the report.'); return false; }
    }
    async function blockPerson(username) {
      const ok = await dialog(`Block ${username}?`, el('p', { class: 'muted' }, 'They won’t be able to find you, message you, add you or invite you, and any friendship or match ends. They aren’t told.'), [['Cancel', 'hb-quiet', false], ['Block', 'hb-danger', true]]);
      if (!ok) return false;
      try { await apiRequest('/api/safety/blocks', { method: 'POST', body: JSON.stringify({ username }) }); toast(`${username} is blocked.`); return true; }
      catch (e) { toast(e.message || 'Could not block.'); return false; }
    }
    function moreMenu(items) {
      const wrap = el('div', { class: 'rel' }); const btn = el('button', { type: 'button', class: 'hb hb-quiet', 'aria-haspopup': 'menu', 'aria-expanded': 'false', 'aria-label': 'More actions' }, '⋯');
      let menu = null;
      const close = () => { if (menu) { menu.remove(); menu = null; btn.setAttribute('aria-expanded', 'false'); } };
      btn.onclick = () => { if (menu) return close(); menu = el('menu', { class: 'h-menu', role: 'menu' }, ...items.map(([label, fn, danger]) => el('li', { role: 'none' }, el('button', { type: 'button', role: 'menuitem', class: danger ? 'danger' : '', onclick: () => { close(); fn(); } }, label))));
        wrap.append(menu); btn.setAttribute('aria-expanded', 'true'); menu.querySelector('button').focus(); };
      wrap.onkeydown = (e) => { if (e.key === 'Escape') { close(); btn.focus(); } };
      document.addEventListener('click', (e) => { if (menu && !wrap.contains(e.target)) close(); });
      wrap.append(btn); return wrap;
    }

    // ── Tabs (hash routing keeps the back button and deep links working) ──
    const views = { discover: renderDiscover, matches: renderMatches, chats: renderChats, friends: renderFriends, parties: renderParties };
    function route() {
      const [tab, ...args] = (location.hash.slice(1) || 'discover').split('/');
      const name = views[tab] ? tab : 'discover';
      for (const t of Object.keys(views)) { $(`v-${t}`).hidden = t !== name; $(`t-${t}`).setAttribute('aria-selected', String(t === name)); $(`t-${t}`).tabIndex = t === name ? 0 : -1; }
      document.body.classList.toggle('in-thread', name === 'chats' && !!args[0]);
      views[name](...args);
    }
    document.querySelectorAll('.s-tab').forEach((b) => { b.onclick = () => { location.hash = b.dataset.tab; }; });
    document.querySelector('.s-tabs').onkeydown = (e) => { const tabs = [...document.querySelectorAll('.s-tab')].filter((t) => !t.hidden); const i = tabs.indexOf(document.activeElement);
      if (i < 0) return; if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; n.focus(); n.click(); } };
    window.addEventListener('hashchange', route);

    // ── Discover ──
    let deck = []; let likedYou = 0; let widen = 0;   // how many in this deck already said yes to me (a count, never who)
    // #discover/<username>: a "new people" email about this person — their card comes first (if they're still in my deck).
    let emailOpenSent = false;
    async function renderDiscover(first) {
      if (!emailOpenSent && /[?&]utm_medium=buddies\b/.test(location.search)) { emailOpenSent = true; trackEvent('buddies_email_open', { named: !!first }); }
      const v = $('v-discover'); v.innerHTML = ''; v.append(el('div', { class: 'h-skeleton', style: 'height:360px', 'aria-hidden': 'true' }));
      let r; try { r = await apiRequest('/api/discover/deck' + (first ? `?first=${encodeURIComponent(first)}` : '')); } catch (e) { v.innerHTML = ''; v.append(el('p', { class: 'h-empty' }, e.message || 'Could not load.')); return; }
      deck = r.cards; likedYou = r.likedYou || 0; widen = r.widen || 0; v.innerHTML = '';
      // First visit: a tutorial card leads the deck (founder 10-23: "the tutorial card should just be the tutorial") —
      // swiping or tapping it only dismisses it; it is never a person.
      let coached = true; try { coached = !!localStorage.getItem('hz_swipe_coach'); } catch (e) { /* storage blocked: no tutorial */ }
      if (!coached && deck.length && !first) deck.unshift({ tutorial: true, username: '__tutorial', name: 'How Discover works' });   // an emailed card comes first
      if (r.reason === 'not_discoverable') {
        // One tap to go live, right here (founder 10-23: a finished profile must never be sent back to "set up").
        const prof = await apiRequest('/api/profile/watch').then((x) => x.profile).catch(() => null);
        const ready = prof && prof.exists && prof.gender && ((prof.genres || []).length || (prof.favorite_titles || []).length || (prof.watchlist || []).length);
        const go = el('button', { type: 'button', class: 'hb hb-primary' }, 'Turn on Discover');
        const age = el('p', { class: 'muted', style: 'font-size:13px;margin:0' }, 'By turning it on, you confirm you’re 18 or older.');
        go.onclick = async () => {
          go.setAttribute('aria-busy', 'true');
          try { await apiRequest('/api/profile/watch', { method: 'PUT', body: JSON.stringify({ discoverable: true, ...(prof && prof.adult_confirmed_at ? {} : { confirm_adult: true }) }) }); toast('You’re in Discover.'); renderDiscover(); }
          catch (e) { go.removeAttribute('aria-busy'); toast(e.message || 'Could not turn it on.'); }
        };
        v.append(el('div', { class: 'h-empty h-stack' }, el('h2', {}, 'Find people who like what you like'),
          el('p', {}, ready ? 'Your profile is ready. Turn on Discover to see people with similar taste, and to be seen by them. Nobody can message you until you both say yes.'
            : 'Tell Herae what you love to watch (it takes about a minute), then you’ll see people with similar taste. Nobody can message you until you both say yes.'),
          ready ? (prof.adult_confirmed_at ? null : age) : null,
          ready ? go : el('a', { class: 'hb hb-primary', href: 'watch-profile.html?start=public&meet=1' }, 'Set up my profile')));
        return;
      }
      if (r.reason === 'groups_only') {
        v.append(el('div', { class: 'h-empty h-stack' }, el('h2', {}, 'Group watch parties only'),
          el('p', {}, 'You chose not to be matched one-to-one. Find or start a watch party instead, or change this in your profile.'),
          el('div', { class: 'h-row', style: 'justify-content:center;flex-wrap:wrap' }, el('a', { class: 'hb hb-primary', href: '#parties' }, 'Watch parties'),
            el('a', { class: 'hb hb-secondary', href: 'watch-profile.html' }, 'Change discovery settings'))));
        return;
      }
      showCard();
    }
    function showCard() {
      const v = $('v-discover'); v.innerHTML = '';
      const c = deck[0];
      if (!c) {
        // Cold start (founder 10-22): never a dead end. They're on the list; the email comes to them; meanwhile two real
        // things to do now — a party (many people, so it works with few), or bring someone they already know.
        const widenBtn = widen > 0 ? el('button', { type: 'button', class: 'hb hb-primary', onclick: async () => {
          try { await apiRequest('/api/profile/watch', { method: 'PUT', body: JSON.stringify({ discovery_scope: 'everyone' }) }); toast('Showing everyone now. Change it any time in your profile.'); renderDiscover(); }
          catch (e) { toast(e.message || 'Could not change it.'); } } }, `Show me everyone (${widen} more ${widen === 1 ? 'person' : 'people'})`) : null;
        v.append(el('div', { class: 'h-empty h-stack' }, el('h2', {}, 'You’re in — we’ll find them for you'),
          el('p', {}, 'Herae’s watch buddies are brand new, so you’ve seen everyone who fits for now. The moment someone who likes what you like joins, we’ll notify you — here in 🔔, by email and on your desktop — with a link straight to their card. Nothing to keep checking.'),
          el('p', { class: 'muted' }, 'More films and genres on your profile means more people fit.'),
          el('div', { class: 'h-row', style: 'justify-content:center;flex-wrap:wrap' }, widenBtn,
            el('a', { class: `hb ${widenBtn ? 'hb-secondary' : 'hb-primary'}`, href: '#parties' }, 'Find a watch party'),
            el('a', { class: 'hb hb-secondary', href: 'contacts.html' }, 'Invite someone I know'),
            el('a', { class: 'hb hb-secondary', href: 'watch-profile.html' }, 'Add to my profile')),
          el('button', { type: 'button', class: 'hb hb-quiet', onclick: undo }, 'Undo last skip')));
        return;
      }
      const stack = el('div', { class: 'dz-stack' });
      if (deck[1]) stack.append(cardEl(deck[1], true));   // the next card waits underneath (and its photo preloads)
      const card = cardEl(c, false); stack.append(card);
      const actions = el('div', { class: 'dz-actions' },
        iconBtn('undo', 'Undo last skip', ICON.undo, undo), iconBtn('no lg', 'Skip', ICON.no, () => decide(-1)),
        iconBtn('yes lg', 'Watch together?', ICON.heart, () => decide(1)), iconBtn('info', `More about ${c.name}`, ICON.up, () => details(c)));
      const tease = likedYou > 0 ? el('p', { class: 'dz-tease', role: 'status' }, el('span', { 'aria-hidden': 'true' }, '👀'), ` ${likedYou === 1 ? 'Someone' : `${likedYou} people`} here already ${likedYou === 1 ? 'wants' : 'want'} to watch with you`) : null;
      v.append(el('div', { class: 'dz' }, tease, stack, actions));
      dragify(card); if (viaKeys) card.focus({ preventScroll: true });   // keyboard users keep their place; a tap never draws a focus ring
    }
    let viaKeys = false;
    const ICON = {
      undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
      no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
      heart: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.4-4.5-9.6-9.1C.9 8.4 3 4.4 6.9 4.4c2.1 0 3.7 1.1 5.1 2.9 1.4-1.8 3-2.9 5.1-2.9 3.9 0 6 4 4.5 7.5C19.4 16.5 12 21 12 21z"/></svg>',
      up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>',
      film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/></svg>',
      spark: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/></svg>',
      lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    };
    const svgEl = (markup) => { const t = document.createElement('template'); t.innerHTML = markup; return t.content.firstChild; };   // our own constants only
    const iconBtn = (cls, label, icon, onclick) => el('button', { type: 'button', class: `dz-btn ${cls}`, 'aria-label': label, title: label, onclick }, svgEl(icon));
    // One card. `behind`: the quiet copy under the top card — no controls, hidden from assistive tech.
    function cardEl(c, behind) {
      if (c.tutorial) return tutorialCard(behind);
      const why = c.why || [];
      const badges = why.slice(0, 2).map((w, i) => el('span', { class: `d-badge${i ? '' : ' hot'}` }, svgEl(/^You both love/.test(w) ? ICON.film : ICON.spark), w));
      const hidden = (c.photoCount || 0) - (c.photos || []).length;

      if (!inside) {
        const full = p.members >= p.capacity;
        if (p.myRequest && p.myRequest.state === 'pending') actions.append(el('span', { class: 'p-state' }, 'Request sent'),
          el('button', { type: 'button', class: 'hb hb-secondary', onclick: () => requestChat(id, p.myRequest.id, p.owner) }, 'Message the host'),
          el('button', { type: 'button', class: 'hb hb-quiet', onclick: () => act('/requests/withdraw', null, 'Request withdrawn.') }, 'Withdraw'));
        else if (full) actions.append(el('p', { class: 'muted' }, 'This party is full.'));
        else if (p.access === 'invited' || p.admission === 'open') actions.append(el('button', { type: 'button', class: 'hb hb-primary', onclick: () => act('/join', { token }, `You joined ${p.title}.`).then(() => { location.hash = `parties/${id}`; }) }, 'Join'));
        else actions.append(el('button', { type: 'button', class: 'hb hb-primary', onclick: async () => {
          const note = el('textarea', { class: 'hi', id: 'pjNote', maxlength: '300', placeholder: 'Say hi, or why you’d like to come (optional)' });
          if (await dialog(`Ask to join ${p.title}`, [el('div', { class: 'h-stack' }, el('label', { class: 'sr-only', for: 'pjNote' }, 'Note'), note, el('p', { class: 'h-help' }, `${p.owner} sees your username and this note.`))], [['Cancel', 'hb-quiet', false], ['Send request', 'hb-primary', true]]))
            act('/requests', { note: note.value, token }, 'Request sent.'); } }, 'Ask to join'));
        return;
      }
      // Live watch: a member asks to join the host's watch (the host approves); the host invites members one by one.
      const partyHandOff = async (payload, okText) => {
        const v = await extVersion;
        if (!v) return needExtension('Watching together runs in the Herae extension for Chrome on a laptop or desktop. Add it (free) and sign in with this account.');
        if (payload.mode && !atLeast(v, '2.7.27')) return toast('This needs the newest Herae (2.7.27), which is on its way to the Chrome Web Store. Chrome updates it by itself within a day or so.');
        const ack = await handOff(payload);
        if (!ack.handled) return needExtension('Herae didn’t answer. Make sure it’s added to Chrome and you’re signed in with this account.');
        toast(ack.error || okText);
      };
      if (p.role !== 'owner' && p.hostWatching) actions.prepend(el('button', { type: 'button', class: 'hb hb-primary', onclick: () => partyHandOff({ target: p.owner, mode: 'join' }, `Asked ${p.owner} to let you in. When they do, Herae asks you to confirm — keep its window open.`) }, 'Join the watch'));
      if (p.role !== 'owner' && !p.hostWatching) actions.append(el('span', { class: 'muted', style: 'font-size:var(--h-size-sm)' }, `${p.owner} hasn’t started watching yet.`));
      if (p.role !== 'owner') actions.append(el('button', { type: 'button', class: 'hb hb-quiet', onclick: async () => {
        if (await dialog(`Leave ${p.title}?`, el('p', { class: 'muted' }, 'You can come back with the invite link while there’s room.'), [['Stay', 'hb-quiet', false], ['Leave', 'hb-danger', true]])) { await act('/leave'); location.hash = 'parties'; } } }, 'Leave party'));
      if (mod) {
        const link = `${location.origin}${location.pathname}#parties/${p.id}/${p.inviteToken}`;
        actions.prepend(el('button', { type: 'button', class: 'hb hb-primary', onclick: async () => { try { await navigator.clipboard.writeText(link); toast('Invite link copied. Anyone with it can join while there’s room.'); } catch (e) { prompt('Copy the invite link:', link); } } }, 'Copy invite link'));
        if (p.requests.length) {
          v.append(el('h2', {}, `Asking to join (${p.requests.length})`));
          const ul = el('ul', { class: 'h-list' });
          p.requests.forEach((q) => ul.append(el('li', {}, el('div', { class: 'row-main' }, el('strong', {}, q.username), q.note ? el('div', { class: 'sub' }, q.note) : null),
            el('button', { type: 'button', class: 'hb hb-quiet', onclick: () => requestChat(id, q.id, q.username) }, 'Chat'),
            el('button', { type: 'button', class: 'hb hb-primary', onclick: () => act(`/requests/${q.id}/approve`, null, `${q.username} is in.`) }, 'Let in'),
            el('button', { type: 'button', class: 'hb hb-quiet', onclick: () => act(`/requests/${q.id}/reject`) }, 'Decline'))));
          v.append(ul);
        }
      }
      if (p.role === 'owner') actions.append(el('button', { type: 'button', class: 'hb hb-secondary', onclick: () => editParty(p) }, 'Settings'));
      v.append(el('h2', { style: 'margin-top:var(--h-5)' }, 'Who’s in'));
      const ul = el('ul', { class: 'h-list' });
      const ROLE = { owner: 'Host', moderator: 'Moderator', member: '' };
      p.memberList.forEach((m) => {
        const items = [];
        if (m.username !== me) {
          if (p.role === 'owner') items.push(p.hostWatching
            ? ['Add to my watch', () => partyHandOff({ target: m.username, mode: 'add', title: p.title }, `Invited ${m.username} into your watch.`)]
            : ['Start watching with them', () => partyHandOff({ target: m.username, title: p.title }, `Inviting ${m.username}… Herae is opening for you.`)]);
          if (p.role === 'owner' && m.role !== 'owner') items.push([m.role === 'moderator' ? 'Remove as moderator' : 'Make moderator', () => act(`/moderators/${m.username}`, { moderator: m.role !== 'moderator' })]);
          if (mod && m.role !== 'owner' && (p.role === 'owner' || m.role === 'member')) items.push([`Remove from party`, async () => {
            if (await dialog(`Remove ${m.username}?`, el('p', { class: 'muted' }, 'They leave the party and can’t come back with the link or by asking.'), [['Cancel', 'hb-quiet', false], ['Remove', 'hb-danger', true]])) act(`/members/${m.username}/remove`, null, `${m.username} removed.`); }, true]);
          items.push(['Report', () => reportPerson(m.username)], ['Block', async () => { if (await blockPerson(m.username)) renderParty(id, token); }, true]);
        }
        ul.append(el('li', {}, el('div', { class: 'row-main' }, el('strong', {}, m.username), ROLE[m.role] ? el('div', { class: 'sub' }, ROLE[m.role]) : null), items.length ? moreMenu(items) : null));
      });
      v.append(ul);
    }
    // The short chat attached to one request to join (applicant ↔ host/moderators). Closes once the request is answered.
    async function requestChat(partyId, rid, withName) {
      const path = `/api/parties/${partyId}/requests/${rid}/messages`;
      for (;;) {
        let t; try { t = await apiRequest(path); } catch (e) { toast(e.message || 'This chat isn’t available.'); return; }
        const list = el('div', { class: 'c-thread', role: 'log', 'aria-label': `Messages with ${withName}`, style: 'max-height:40vh;overflow:auto' },
          t.messages.length ? t.messages.map((m) => el('div', { class: `c-msg${m.sender === me ? ' mine' : ''}` }, m.body, el('time', {}, `${m.sender === me ? 'You' : m.sender} · ${when(m.createdAt)}`)))
            : el('p', { class: 'muted' }, 'No messages yet.'));
        const box = t.open ? el('textarea', { class: 'hi', id: 'rqMsg', maxlength: '1000', placeholder: 'Write a message', 'aria-label': 'Message' }) : null;
        const res = await dialog(`About joining — ${withName}`, [el('div', { class: 'h-stack' }, list, box || el('p', { class: 'h-help' }, 'This request has been answered, so the chat is closed.'))],
          t.open ? [['Close', 'hb-quiet', false], ['Send', 'hb-primary', true]] : [['Close', 'hb-quiet', false]]);
        if (!res) return;
        if (!box.value.trim()) continue;
        try { await apiRequest(path, { method: 'POST', body: JSON.stringify({ body: box.value }) }); }
        catch (e) { toast(e.message || 'Could not send.'); }
      }
    }
    // Create (no argument) or edit (owner) a party.
    async function editParty(p = null) {
      const local = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      const t = el('input', { class: 'hi', id: 'ptTitle', maxlength: '80', placeholder: 'e.g. Friday horror night', value: p ? p.title : '' });
      const d = el('textarea', { class: 'hi', id: 'ptDesc', maxlength: '500', placeholder: 'The vibe (optional)' }); if (p && p.description) d.value = p.description;
      const ft = el('input', { class: 'hi', id: 'ptFilm', maxlength: '120', placeholder: 'e.g. Past Lives', value: p && p.filmTitle ? p.filmTitle : '' });
      const fu = el('input', { class: 'hi', id: 'ptLink', type: 'url', maxlength: '500', placeholder: 'https://… (optional — a Netflix, Prime or YouTube link)', value: p && p.filmUrl ? p.filmUrl : '' });
      const cap = el('input', { class: 'hi', id: 'ptCap', type: 'number', min: '2', max: '50', value: p ? p.capacity : 8 });
      const at = el('input', { class: 'hi', id: 'ptAt', type: 'datetime-local', value: p && p.startsAt ? local(new Date(p.startsAt.replace(' ', 'T') + 'Z')) : '' });
      const radio = (name, value, label, checked) => el('label', { class: 'h-row' }, el('input', { type: 'radio', name, value, checked }), ` ${label}`);
      const pub = p ? p.visibility === 'public' : false; const open = p ? p.admission === 'open' : false;
      const adm = el('fieldset', { style: 'border:0;padding:0', hidden: !pub }, el('legend', { class: 'h-label' }, 'Who gets in'),
        radio('ptAdm', 'request', 'People ask, you let them in', !open), radio('ptAdm', 'open', 'Anyone 18+ can join', open));
      const vis = el('fieldset', { style: 'border:0;padding:0' }, el('legend', { class: 'h-label' }, 'Who can find it'),
        radio('ptVis', 'private', 'Only people with the invite link', !pub), radio('ptVis', 'public', 'Listed in public parties (18+)', pub));
      vis.onchange = () => { adm.hidden = vis.querySelector('input:checked').value !== 'public'; };
      const rotate = p ? el('label', { class: 'h-row' }, el('input', { type: 'checkbox', id: 'ptRot', style: 'width:20px;height:20px;accent-color:var(--h-accent)' }), ' Make a new invite link (the old one stops working)') : null;
      const ok = await dialog(p ? 'Party settings' : 'Start a watch party', [el('div', { class: 'h-stack' },
        el('label', { class: 'h-label', for: 'ptTitle' }, 'Name'), t, el('label', { class: 'h-label', for: 'ptFilm' }, 'What you’re watching'), ft,
        el('label', { class: 'h-label', for: 'ptLink' }, 'Watch link (optional)'), fu, el('label', { class: 'h-label', for: 'ptDesc' }, 'About (optional)'), d,
        el('label', { class: 'h-label', for: 'ptAt' }, 'When (optional)'), at, el('label', { class: 'h-label', for: 'ptCap' }, 'How many people, you included'), cap, vis, adm, rotate)],
        p ? [['End party', 'hb-danger', 'end'], ['Cancel', 'hb-quiet', false], ['Save', 'hb-primary', true]] : [['Cancel', 'hb-quiet', false], ['Create', 'hb-primary', true]]);
      if (!ok) return;
      if (ok === 'end') {
        if (await dialog(`End ${p.title}?`, el('p', { class: 'muted' }, 'Everyone loses access and the invite link stops working. This can’t be undone.'), [['Keep it', 'hb-quiet', false], ['End party', 'hb-danger', true]])) {
          try { await apiRequest(`/api/parties/${p.id}/end`, { method: 'POST' }); toast('Party ended.'); location.hash = 'parties'; } catch (e) { toast(e.message || 'Could not end the party.'); } }
        return;
      }
      const body = { title: t.value, description: d.value, film_title: ft.value, film_url: fu.value.trim(), film_source: fu.value.trim() ? 'url' : 'title', capacity: Number(cap.value), starts_at: at.value ? new Date(at.value).toISOString() : null,
        visibility: vis.querySelector('input:checked').value, admission: adm.querySelector('input:checked').value };
      if (rotate && rotate.querySelector('input').checked) body.rotate_link = true;
      try {
        const r = await apiRequest(p ? `/api/parties/${p.id}` : '/api/parties', { method: p ? 'PATCH' : 'POST', body: JSON.stringify(body) });
        toast(p ? 'Saved.' : 'Party created. Copy the invite link to bring people in.');
        if (p) renderParty(p.id); else location.hash = `parties/${r.party.id}`;
      } catch (e) { toast(e.message || 'Could not save.'); }
    }

    async function refreshBadges() {
      try {
        const [c, f, m] = await Promise.all([apiRequest('/api/chats'), apiRequest('/api/contacts'), apiRequest('/api/discover/matches').catch(() => ({ matches: [] }))]);
        const set = (id, n) => { $(id).hidden = !n; $(id).textContent = n || ''; };
        set('b-chats', c.conversations.reduce((s, x) => s + (x.unread || 0), 0)); set('b-friends', f.incoming.length); set('b-matches', m.matches.filter((x) => x.isNew).length);
      } catch (e) { /* badges are a convenience */ }
    }
    route(); refreshBadges();
  })();
  </script>
