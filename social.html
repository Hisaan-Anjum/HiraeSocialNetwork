<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>People — Herae</title>
<meta name="robots" content="noindex">
<meta name="herae-memories-site" content="1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="h2.css">
<style>
  body { margin: 0; min-height: 100dvh; }
  .s-tabs { display: flex; gap: var(--h-1); padding: 0 max(var(--h-4), calc((100vw - 1120px) / 2)); border-bottom: 1px solid var(--h-line); position: sticky; top: 60px; background: var(--h-bg); z-index: 5; }
  .s-tab { position: relative; min-height: var(--h-tap); padding: 0 var(--h-4); background: none; border: 0; color: var(--h-text-2); font: 600 var(--h-size-sm) var(--h-font-body); cursor: pointer; border-bottom: 2px solid transparent; }
  .s-tab[aria-selected="true"] { color: var(--h-text); border-bottom-color: var(--h-accent); }
  .s-badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--h-coral); color: #1b0d09; font-size: 11px; line-height: 18px; text-align: center; }
  .s-badge[hidden] { display: none; }
  .s-tab { white-space: nowrap; }
  @media (max-width: 640px) {
    /* phones: the global bottom bar is the main nav; these become a row of pills under the header */
    .s-tabs { top: 56px; gap: 8px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--h-line); }
    .s-tabs::-webkit-scrollbar { display: none; }
    .s-tab { min-height: 36px; padding: 0 14px; border: 1px solid var(--h-line-strong); border-radius: 999px; }
    .s-tab[aria-selected="true"] { background: #F8FAFC; color: #0F172A; border-color: #F8FAFC; }
    main.h-page { padding-bottom: 96px; }
  }
  /* deck */
  #v-discover { overflow-x: clip; }   /* a card mid-swipe must not make the page scroll sideways */
  .d-card { position: relative; touch-action: pan-y; user-select: none; transition: transform var(--h-med) var(--h-ease); }
  .d-card.dragging { transition: none; }
  .d-stamp { position: absolute; top: var(--h-5); padding: 4px 12px; border: 2px solid currentColor; border-radius: var(--h-r-md, 8px); font: 700 var(--h-size-md) var(--h-font-body); opacity: 0; pointer-events: none; z-index: 2; }
  .d-stamp.yes { left: var(--h-5); color: #A5B4FC; transform: rotate(-8deg); }
  .d-stamp.no { right: var(--h-5); color: var(--h-text-2); transform: rotate(8deg); }
  .d-head { display: flex; gap: var(--h-3); align-items: center; margin-bottom: var(--h-3); }
  .d-head .h-avatar { width: 56px; height: 56px; font-size: 22px; }
  .d-why { list-style: none; margin: 0 0 var(--h-4); padding: 0; }
  .d-why li { color: var(--h-coral); font-weight: 600; font-size: var(--h-size-sm); padding: 2px 0; }
  .d-meta dt { font-size: var(--h-size-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--h-text-3); margin-top: var(--h-3); }
  .d-meta dd { margin: 2px 0 0; }
  .d-actions { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--h-3); margin-top: var(--h-5); align-items: center; }
  .d-actions .hb { width: 100%; }
  .d-hint { text-align: center; font-size: var(--h-size-xs); color: var(--h-text-3); margin-top: var(--h-3); }
  .d-more { position: absolute; top: var(--h-3); right: var(--h-3); }
  /* chat — a messenger: compact header, bubbles, one slim composer row */
  .c-view { display: flex; flex-direction: column; min-height: calc(100dvh - 140px); }
  .c-head { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: var(--h-3); padding: var(--h-2) 0; background: var(--h-bg); border-bottom: 1px solid var(--h-line); }
  .c-head .c-back { width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 50%; font-size: 20px; }
  .c-head .h-avatar { width: 40px; height: 40px; font-size: 16px; }
  .c-who { flex: 1; min-width: 0; } .c-who b { display: block; font-size: var(--h-size-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-who span { font-size: var(--h-size-xs); color: var(--h-text-3); }
  .c-thread { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: var(--h-4) 0; }
  .c-msg { max-width: min(78%, 520px); padding: 9px 14px 7px; border-radius: 20px; border-bottom-left-radius: 6px; background: var(--h-surface-2); color: var(--h-text); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
  .c-msg.mine { align-self: flex-end; background: #4F46E5; color: #fff; border-radius: 20px; border-bottom-right-radius: 6px; }
  .c-msg.failed { outline: 2px solid var(--h-danger); }
  .c-msg time { display: block; font-size: 11px; opacity: .7; margin-top: 2px; text-align: right; }
  .c-sys { align-self: center; font-size: var(--h-size-xs); color: var(--h-text-3); padding: 4px 10px; }
  .c-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--h-3); padding: var(--h-6) 0; }
  .c-empty .h-avatar { width: 72px; height: 72px; font-size: 28px; }
  .h-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .d-photo { position: relative; margin: calc(-1 * var(--h-5)) calc(-1 * var(--h-5)) var(--h-4); aspect-ratio: 4 / 5; max-height: 62vh; overflow: hidden; border-radius: var(--h-r-lg) var(--h-r-lg) 0 0; background: var(--h-surface-2); cursor: pointer; }
  .d-photo img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .d-bars { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; gap: 4px; }
  .d-bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.4); } .d-bars i.on { background: #fff; }
  .d-photos { display: inline-block; margin-top: 4px; font-size: var(--h-size-xs); font-weight: 600; color: var(--h-text-2); padding: 3px 10px; border-radius: 999px; background: var(--h-surface-2); }
  .ph-strip { display: grid; grid-auto-flow: column; grid-auto-columns: min(78vw, 360px); gap: var(--h-3); overflow-x: auto; scroll-snap-type: x mandatory; }
  .ph-strip img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--h-r-lg); scroll-snap-align: start; }
  .c-empty h2 { font-size: var(--h-size-lg); margin: 0; } .c-empty p { margin: 0; color: var(--h-text-3); font-size: var(--h-size-sm); }
  .c-starters { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--h-2); }
  .c-compose { position: sticky; bottom: 0; display: flex; align-items: flex-end; gap: var(--h-2); padding: var(--h-2) 0 calc(var(--h-2) + env(safe-area-inset-bottom)); background: var(--h-bg); border-top: 1px solid var(--h-line); }
  .c-compose textarea { flex: 1; min-height: 44px; max-height: 128px; resize: none; padding: 11px 16px; border-radius: 22px; background: var(--h-surface-2); border: 1px solid var(--h-line-strong); color: var(--h-text); font: var(--h-size-md)/1.35 var(--h-font-body); box-sizing: border-box; }
  .c-compose textarea:focus-visible { outline: none; border-color: var(--h-focus); }
  .c-ico { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--h-line-strong); background: var(--h-surface-2); color: var(--h-text); font-size: 19px; cursor: pointer; display: grid; place-items: center; }
  .c-ico.send { background: #4F46E5; border-color: #4F46E5; color: #fff; }
  .c-ico:disabled { opacity: .45; cursor: default; }
  .c-ico svg { width: 20px; height: 20px; }
  /* inside a conversation on a phone the bottom tabs give their space to the chat */
  @media (max-width: 640px) { body.in-thread .s-tabs { display: none; } body.in-thread .c-view { min-height: calc(100dvh - 72px); } }
  .row-main { flex: 1; min-width: 0; }
  .tap-row { cursor: pointer; }
  .row-main .sub { font-size: var(--h-size-sm); color: var(--h-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .new-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--h-coral); flex: none; }
  menu.h-menu { position: absolute; right: 0; top: 100%; margin: 4px 0 0; padding: var(--h-1); list-style: none; background: var(--h-surface-2); border: 1px solid var(--h-line-strong); border-radius: var(--h-r-md); z-index: 10; min-width: 180px; }
  menu.h-menu button { display: block; width: 100%; text-align: left; min-height: 40px; padding: 0 var(--h-3); background: none; border: 0; color: var(--h-text); font: var(--h-size-sm) var(--h-font-body); cursor: pointer; border-radius: var(--h-r-sm); }
  menu.h-menu button:hover, menu.h-menu button:focus-visible { background: var(--h-surface-3); }
  menu.h-menu button.danger { color: var(--h-danger); }
  .rel { position: relative; }
  .p-card { align-self: stretch; border: 1px solid var(--h-line-strong); border-radius: var(--h-r-lg); padding: var(--h-4); background: var(--h-surface); }
  .p-card .p-title { font-family: var(--h-font-display); font-size: var(--h-size-lg); }
  .p-card .p-meta { font-size: var(--h-size-sm); color: var(--h-text-2); margin: var(--h-1) 0 var(--h-3); }
  .p-state { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: var(--h-r-pill); border: 1px solid var(--h-line-strong); }
  .p-state.accepted { color: var(--h-ok); border-color: currentColor; }
  .c-sys { align-self: center; font-size: var(--h-size-xs); color: var(--h-text-3); }
</style>
</head>
<body class="h2">
  <header class="h-topbar">
    <a class="h-brand" href="memories.html" aria-label="herae — home"><img src="herae-logo-on-dark.svg" alt="herae" height="26"></a>
    <a class="hb hb-quiet" href="watch-profile.html">Profile &amp; privacy</a>
  </header>
  <nav class="s-tabs" role="tablist" aria-label="People">
    <button class="s-tab" role="tab" id="t-discover" aria-controls="v-discover" data-tab="discover">Discover</button>
    <button class="s-tab" role="tab" id="t-matches" aria-controls="v-matches" data-tab="matches">Matches<span class="s-badge" id="b-matches" hidden></span></button>
    <button class="s-tab" role="tab" id="t-chats" aria-controls="v-chats" data-tab="chats">Chats<span class="s-badge" id="b-chats" hidden></span></button>
    <button class="s-tab" role="tab" id="t-friends" aria-controls="v-friends" data-tab="friends" hidden>Friends<span class="s-badge" id="b-friends" hidden></span></button>
    <button class="s-tab" role="tab" id="t-parties" aria-controls="v-parties" data-tab="parties">Parties</button>
  </nav>
  <main class="h-page" id="main">
    <section id="v-discover" role="tabpanel" aria-labelledby="t-discover" hidden></section>
    <section id="v-matches" role="tabpanel" aria-labelledby="t-matches" hidden></section>
    <section id="v-chats" role="tabpanel" aria-labelledby="t-chats" hidden></section>
    <section id="v-friends" role="tabpanel" aria-labelledby="t-friends" hidden></section>
    <section id="v-parties" role="tabpanel" aria-labelledby="t-parties" hidden></section>
  </main>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <dialog class="h-dialog" id="dlg" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody" style="margin:var(--h-3) 0 var(--h-5)"></div>
    <div class="h-row" style="justify-content:flex-end" id="dlgActions"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="api.js"></script>
<script src="app-nav.js"></script>
  <script>
  requireAuth();
  (() => {
    const $ = (id) => document.getElementById(id);
    const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v); }
      for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
      return e; };
    const me = (getAuth() || {}).username;
    const announce = (t) => { $('live').textContent = ''; setTimeout(() => { $('live').textContent = t; }, 30); };
    let toastTimer;
    const toast = (t) => { document.querySelectorAll('.h-toast').forEach((x) => x.remove()); const x = el('div', { class: 'h-toast', role: 'status' }, t); document.body.append(x); clearTimeout(toastTimer); toastTimer = setTimeout(() => x.remove(), 3500); };
    // Buddy photos are private: ask once per person what this viewer may see, then show the main photo in place of
    // the letter avatar. Strangers get { locked: true } and never an image.
    const photoInfo = new Map();
    const photosOf = (u) => { if (!photoInfo.has(u)) photoInfo.set(u, apiRequest(`/api/photos/of/${encodeURIComponent(u)}`).catch(() => ({ photos: [], count: 0, locked: true }))); return photoInfo.get(u); };
    function photoAvatar(username, person) {
      const a = avatar(person);
      photosOf(username).then(async (r) => { if (!r.photos.length) return; const src = await apiImage(r.photos[0].url); if (!src) return;
        a.textContent = ''; a.removeAttribute('aria-hidden'); const img = document.createElement('img'); img.src = src; img.alt = ''; a.append(img); });
      return a;
    }
    async function showPhotos(username, name) {
      const r = await photosOf(username);
      if (!r.photos.length) { toast(r.locked ? `${name}’s photos are private for now.` : `${name} hasn’t added photos yet.`); return; }
      const srcs = await Promise.all(r.photos.map((p) => apiImage(p.url)));
      const strip = el('div', { class: 'ph-strip' }, ...srcs.filter(Boolean).map((src, i) => el('img', { src, alt: `${name}, photo ${i + 1}` })));
      dialog(`${name}`, [strip], [['Close', 'hb-primary', false]]);
    }
    const avatar = (p) => p.avatarUrl ? el('span', { class: 'h-avatar' }, el('img', { src: p.avatarUrl, alt: '' })) : el('span', { class: 'h-avatar', 'aria-hidden': 'true' }, (p.name || p.username || '?')[0].toUpperCase());
    const LABEL = { weekday_evenings: 'Weekday evenings', weekend_days: 'Weekend days', weekend_evenings: 'Weekend evenings', late_nights: 'Late nights', flexible: 'Flexible',
      one_to_one: 'One-to-one', small_group: 'A few friends', big_party: 'Big parties', quiet_watcher: 'Quiet watcher', commentator: 'Running commentary', rewatcher: 'Rewatcher',
      binger: 'Binger', one_episode: 'One episode a night', night_owl: 'Night owl', subtitles_on: 'Subtitles always', cries_at_films: 'Cries at films', snack_first: 'Snacks first', pauses_to_discuss: 'Pauses to discuss' };
    // Tapping anywhere on a list row opens it (people tap the name, not the small button); the button stays for keyboards.
    const rowGo = (hash) => (e) => { if (!e.target.closest('a, button, menu')) location.hash = hash; };
    const L = (xs) => (xs || []).map((x) => LABEL[x] || x).join(', ');
    const when = (s) => { const d = new Date(String(s).replace(' ', 'T') + (String(s).includes('Z') ? '' : 'Z')); return isNaN(d) ? '' : d.toLocaleString(undefined, { hour: 'numeric', minute: '2-digit', month: 'short', day: 'numeric' }); };

    // The extension hand-off (content.js __heraeStartSession). Resolves { handled:false } when no extension answers.
    const handOff = (payload) => new Promise((resolve) => {
      let done = false; const finish = (v) => { if (!done) { done = true; window.removeEventListener('message', on); resolve(v); } };
      function on(e) { if (e.source === window && e.data && e.data.__heraeStartSessionAck === true) finish({ handled: true, error: e.data.error, busy: e.data.busy }); }
      window.addEventListener('message', on);
      window.postMessage({ __heraeStartSession: true, url: '', title: '', ...payload }, location.origin);
      setTimeout(() => finish({ handled: false }), 1200);
    });
    // Which extension version is here (null = none). Party hand-offs need 2.7.27+; older ones would send an invite instead.
    const extVersion = new Promise((resolve) => {
      const on = (e) => { if (e.source === window && e.data && e.data.__heraeExtension === true) { window.removeEventListener('message', on); resolve(String(e.data.version || '0')); } };
      window.addEventListener('message', on); window.postMessage({ __heraePing: true }, location.origin); setTimeout(() => resolve(null), 1500);
    });
    const atLeast = (v, min) => { const a = v.split('.').map(Number); const b = min.split('.').map(Number);
      for (let i = 0; i < 3; i++) if ((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0); return true; };
    async function needExtension(why) {
      const go = await dialog('Herae needs to be in Chrome on this computer', el('p', { class: 'muted' }, why), [['Not now', 'hb-quiet', false], ['Add Herae to Chrome', 'hb-primary', true]]);
      if (go) window.open('https://chromewebstore.google.com/detail/kadhimjoddiaenogicbdnejoabdiimgn?utm_source=social', '_blank', 'noopener');
    }

    // Today's messages show just the time; older ones the date too.
    const msgTime = (s) => { const d = new Date(String(s).replace(' ', 'T') + (String(s).includes('Z') ? '' : 'Z')); if (isNaN(d)) return '';
      return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : when(s); };
    function dialog(title, body, actions) {
      $('dlgTitle').textContent = title; const b = $('dlgBody'); b.innerHTML = ''; b.append(...[].concat(body));
      const a = $('dlgActions'); a.innerHTML = '';
      return new Promise((resolve) => {
        for (const [label, cls, val] of actions) a.append(el('button', { type: 'button', class: `hb ${cls}`, onclick: () => { $('dlg').close(); resolve(val); } }, label));
        $('dlg').onclose = () => resolve(null); $('dlg').showModal();
      });
    }
    // Report and block, reachable from every person surface.
    async function reportPerson(username, type = 'user', id = null) {
      const reasons = [['harassment', 'Harassment or bullying'], ['spam', 'Spam or scam'], ['impersonation', 'Pretending to be someone'], ['privacy', 'Shared private information'], ['threat', 'Threats or violence'], ['inappropriate', 'Inappropriate content'], ['other', 'Something else']];
      const sel = el('select', { class: 'hi', id: 'rsn', 'aria-label': 'Reason' }, ...reasons.map(([v, t]) => el('option', { value: v }, t)));
      const det = el('textarea', { class: 'hi', id: 'rdet', maxlength: '1000', placeholder: 'Anything that helps (optional)', 'aria-label': 'Details' });
      const blockToo = el('input', { type: 'checkbox', id: 'rblk', checked: true, style: 'width:20px;height:20px;accent-color:var(--h-accent)' });
      const ok = await dialog(`Report ${username}`, [el('div', { class: 'h-stack' }, sel, det, el('label', { class: 'h-row' }, blockToo, el('span', {}, `Also block ${username}`)), el('p', { class: 'h-help' }, 'Reports are reviewed by the Herae team. We don’t tell them who reported.'))], [['Cancel', 'hb-quiet', false], ['Send report', 'hb-danger', true]]);
      if (!ok) return false;
      try {
        await apiRequest('/api/safety/reports', { method: 'POST', body: JSON.stringify({ username, type, id, reason: sel.value, details: det.value }) });
        if (blockToo.checked) await apiRequest('/api/safety/blocks', { method: 'POST', body: JSON.stringify({ username }) });
        toast(blockToo.checked ? `Reported and blocked ${username}.` : 'Report sent. Thank you.'); return true;
      } catch (e) { toast(e.message || 'Could not send the report.'); return false; }
    }
    async function blockPerson(username) {
      const ok = await dialog(`Block ${username}?`, el('p', { class: 'muted' }, 'They won’t be able to find you, message you, add you or invite you, and any friendship or match ends. They aren’t told.'), [['Cancel', 'hb-quiet', false], ['Block', 'hb-danger', true]]);
      if (!ok) return false;
      try { await apiRequest('/api/safety/blocks', { method: 'POST', body: JSON.stringify({ username }) }); toast(`${username} is blocked.`); return true; }
      catch (e) { toast(e.message || 'Could not block.'); return false; }
    }
    function moreMenu(items) {
      const wrap = el('div', { class: 'rel' }); const btn = el('button', { type: 'button', class: 'hb hb-quiet', 'aria-haspopup': 'menu', 'aria-expanded': 'false', 'aria-label': 'More actions' }, '⋯');
      let menu = null;
      const close = () => { if (menu) { menu.remove(); menu = null; btn.setAttribute('aria-expanded', 'false'); } };
      btn.onclick = () => { if (menu) return close(); menu = el('menu', { class: 'h-menu', role: 'menu' }, ...items.map(([label, fn, danger]) => el('li', { role: 'none' }, el('button', { type: 'button', role: 'menuitem', class: danger ? 'danger' : '', onclick: () => { close(); fn(); } }, label))));
        wrap.append(menu); btn.setAttribute('aria-expanded', 'true'); menu.querySelector('button').focus(); };
      wrap.onkeydown = (e) => { if (e.key === 'Escape') { close(); btn.focus(); } };
      document.addEventListener('click', (e) => { if (menu && !wrap.contains(e.target)) close(); });
      wrap.append(btn); return wrap;
    }

    // ── Tabs (hash routing keeps the back button and deep links working) ──
    const views = { discover: renderDiscover, matches: renderMatches, chats: renderChats, friends: renderFriends, parties: renderParties };
    function route() {
      const [tab, ...args] = (location.hash.slice(1) || 'discover').split('/');
      const name = views[tab] ? tab : 'discover';
      for (const t of Object.keys(views)) { $(`v-${t}`).hidden = t !== name; $(`t-${t}`).setAttribute('aria-selected', String(t === name)); $(`t-${t}`).tabIndex = t === name ? 0 : -1; }
      document.body.classList.toggle('in-thread', name === 'chats' && !!args[0]);
      views[name](...args);
    }
    document.querySelectorAll('.s-tab').forEach((b) => { b.onclick = () => { location.hash = b.dataset.tab; }; });
    document.querySelector('.s-tabs').onkeydown = (e) => { const tabs = [...document.querySelectorAll('.s-tab')].filter((t) => !t.hidden); const i = tabs.indexOf(document.activeElement);
      if (i < 0) return; if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; n.focus(); n.click(); } };
    window.addEventListener('hashchange', route);

    // ── Discover ──
    let deck = [];
    async function renderDiscover() {

    async function unmatchWith(other, name = other) {
      const ok = await dialog(`Unmatch ${name}?`, el('p', { class: 'muted' }, 'You won’t be able to message each other or match again through Discover. The messages so far stay visible to each of you. This doesn’t block them.'), [['Cancel', 'hb-quiet', false], ['Unmatch', 'hb-danger', true]]);
      if (!ok) return;
      const r = await apiRequest('/api/discover/matches'); const m = r.matches.find((x) => x.person.username === other);
      if (m) await apiRequest(`/api/discover/matches/${m.id}/unmatch`, { method: 'POST' });
      toast(`You unmatched ${name}.`); location.hash = 'matches';
    }

    // ── Friends (the existing contacts system) ──
    async function addFriend(username) {
      try { await apiRequest('/api/contacts/requests', { method: 'POST', body: JSON.stringify({ username }) }); toast(`Friend request sent to ${username}.`); }
      catch (e) { toast(/already/i.test(e.message || '') ? e.message : (e.message || 'Could not send the request.')); }
    }
    async function renderFriends() {
      const v = $('v-friends'); v.innerHTML = ''; v.append(el('h1', {}, 'Friends'));
      let r; try { r = await apiRequest('/api/contacts'); } catch (e) { v.append(el('p', { class: 'h-empty' }, e.message || 'Could not load.')); return; }
      const addForm = el('form', { class: 'h-row', style: 'margin:var(--h-3) 0 var(--h-5)' },
        el('label', { class: 'sr-only', for: 'addIn' }, 'Username'), el('input', { class: 'hi', id: 'addIn', placeholder: 'Add a friend by username', autocomplete: 'off', maxlength: '64' }),
        el('button', { type: 'submit', class: 'hb hb-primary' }, 'Add'));
      addForm.onsubmit = async (e) => { e.preventDefault(); const u = $('addIn').value.trim().toLowerCase(); if (!u) return; await addFriend(u); renderFriends(); };
      v.append(addForm);
      const section = (title, rows, render) => { if (!rows.length) return; v.append(el('h2', { style: 'margin-top:var(--h-5)' }, title)); const ul = el('ul', { class: 'h-list' }); rows.forEach((x) => ul.append(render(x))); v.append(ul); };
      section(`Requests for you (${r.incoming.length})`, r.incoming, (x) => el('li', {}, avatar(x), el('div', { class: 'row-main' }, el('strong', {}, x.username)),
        el('button', { type: 'button', class: 'hb hb-primary', onclick: async () => { await apiRequest(`/api/contacts/${x.id}/accept`, { method: 'POST' }); toast(`You and ${x.username} are friends.`); renderFriends(); refreshBadges(); } }, 'Accept'),
        el('button', { type: 'button', class: 'hb hb-quiet', onclick: async () => { await apiRequest(`/api/contacts/${x.id}`, { method: 'DELETE' }); renderFriends(); refreshBadges(); } }, 'Decline')));
      section('Your friends', r.contacts, (x) => el('li', {}, avatar(x), el('div', { class: 'row-main' }, el('strong', {}, x.username), el('div', { class: 'sub' }, x.online ? 'Online now' : '')),
        el('button', { type: 'button', class: 'hb hb-secondary', onclick: async () => { const c = await apiRequest(`/api/chats/with/${encodeURIComponent(x.username)}`, { method: 'POST' }); location.hash = `chats/${c.id}`; } }, 'Message'),
        moreMenu([['Remove friend', async () => {
          const ok = await dialog(`Remove ${x.username} as a friend?`, el('p', { class: 'muted' }, 'You won’t see each other in Friends and can’t message each other unless you’re also matched. Your memories together stay. This doesn’t block them.'), [['Cancel', 'hb-quiet', false], ['Remove', 'hb-danger', true]]);
          if (ok) { await apiRequest(`/api/contacts/${x.id}`, { method: 'DELETE' }); toast(`${x.username} removed.`); renderFriends(); } }],
          ['Report', () => reportPerson(x.username)], ['Block', async () => { if (await blockPerson(x.username)) renderFriends(); }, true]])));
      section('Waiting for them', r.outgoing, (x) => el('li', {}, avatar(x), el('div', { class: 'row-main' }, el('strong', {}, x.username), el('div', { class: 'sub' }, 'Request pending')),
        el('button', { type: 'button', class: 'hb hb-quiet', onclick: async () => { await apiRequest(`/api/contacts/${x.id}`, { method: 'DELETE' }); renderFriends(); } }, 'Cancel')));
      if (!r.contacts.length && !r.incoming.length && !r.outgoing.length) v.append(el('p', { class: 'h-empty' }, 'No friends on Herae yet. Add someone by username, or become friends with a match from their chat.'));
    }

    // ── Parties (private by default; the invite link is #parties/<id>/<token>, a hash, so it never reaches server logs) ──
    const partyRow = (p) => el('li', { class: 'tap-row', onclick: rowGo(`parties/${p.id}`) }, el('div', { class: 'row-main' }, el('strong', {}, p.title),
        el('div', { class: 'sub' }, [`${p.members}/${p.capacity} people`, p.visibility === 'public' ? (p.admission === 'open' ? 'Public · open' : 'Public · ask to join') : 'Private',
          p.startsAt ? when(p.startsAt) : '', p.role === 'owner' ? 'You host' : ''].filter(Boolean).join(' · '))),
      el('a', { class: 'hb hb-secondary', href: `#parties/${p.id}` }, 'Open'));
    async function renderParties(id, token) {
      if (id) return renderParty(Number(id), token);
      const v = $('v-parties'); v.innerHTML = '';
      v.append(el('div', { class: 'h-row', style: 'justify-content:space-between;flex-wrap:wrap' }, el('h1', {}, 'Watch parties'),
        el('button', { type: 'button', class: 'hb hb-primary', onclick: () => editParty() }, 'Start a party')));
      let mine; try { mine = await apiRequest('/api/parties/mine'); } catch (e) { v.append(el('p', { class: 'h-empty' }, e.message || 'Could not load.')); return; }
      v.append(el('h2', { style: 'margin-top:var(--h-5)' }, 'Your parties'));
      if (mine.parties.length) { const ul = el('ul', { class: 'h-list' }); mine.parties.forEach((p) => ul.append(partyRow(p))); v.append(ul); }
      else v.append(el('p', { class: 'muted' }, 'None yet. Start one and send the invite link to the people you want there. New parties are private.'));
      v.append(el('h2', { style: 'margin-top:var(--h-6, 32px)' }, 'Public parties'));
      const list = el('ul', { class: 'h-list' }); const more = el('button', { type: 'button', class: 'hb hb-secondary', hidden: true }, 'Show more');
      v.append(list, more);
      const page = async (before) => {
        const r = await apiRequest(`/api/parties/directory${before ? `?before=${before}` : ''}`).catch(() => ({ parties: [] }));
        if (r.reason === 'adult_required') { list.replaceWith(el('p', { class: 'muted' }, 'Public parties are for adults. Confirm you’re 18 or over in ', el('a', { href: 'watch-profile.html' }, 'your watch profile'), ' to see them.')); return; }
        r.parties.forEach((p) => list.append(partyRow(p)));
        if (!before && !r.parties.length) list.append(el('li', { class: 'muted' }, 'No public parties right now.'));
        more.hidden = !r.next; more.onclick = () => page(r.next);
      };
      await page();
    }
    async function renderParty(id, token) {
      const v = $('v-parties'); v.innerHTML = '';
      const back = el('a', { class: 'hb hb-quiet', href: '#parties' }, '← Parties');
      let p; try { p = (await apiRequest(`/api/parties/${id}${token ? `?token=${encodeURIComponent(token)}` : ''}`)).party; }
      catch (e) { v.append(back, el('p', { class: 'h-empty' }, 'This party isn’t available. The link may have changed, or it has ended.')); return; }
      const act = async (path, body, done) => { try { await apiRequest(`/api/parties/${id}${path}`, { method: 'POST', body: JSON.stringify(body || {}) }); if (done) toast(done); renderParty(id, token); }
        catch (e) { toast(e.message || 'Could not do that.'); renderParty(id, token); } };
      const mod = p.access === 'moderator'; const inside = mod || p.access === 'member';
      v.append(el('div', { class: 'h-row', style: 'justify-content:space-between' }, back,
        p.role === 'owner' ? null : moreMenu([['Report this party', () => reportPerson(p.owner, 'party', String(p.id))], ['Block the host', async () => { if (await blockPerson(p.owner)) location.hash = 'parties'; }, true]])));
      v.append(el('h1', {}, p.title), el('p', { class: 'muted' }, [`Hosted by ${p.owner}`, `${p.members}/${p.capacity} people`, p.visibility === 'public' ? 'Public' : 'Private', p.startsAt ? when(p.startsAt) : ''].filter(Boolean).join(' · ')));
      if (p.description) v.append(el('p', {}, p.description));
      const actions = el('div', { class: 'h-row', style: 'flex-wrap:wrap;margin:var(--h-4) 0' }); v.append(actions);
      if (!inside) {
        const full = p.members >= p.capacity;
        if (p.myRequest && p.myRequest.state === 'pending') actions.append(el('span', { class: 'p-state' }, 'Request sent'),
          el('button', { type: 'button', class: 'hb hb-secondary', onclick: () => requestChat(id, p.myRequest.id, p.owner) }, 'Message the host'),
          el('button', { type: 'button', class: 'hb hb-quiet', onclick: () => act('/requests/withdraw', null, 'Request withdrawn.') }, 'Withdraw'));
        else if (full) actions.append(el('p', { class: 'muted' }, 'This party is full.'));
        else if (p.access === 'invited' || p.admission === 'open') actions.append(el('button', { type: 'button', class: 'hb hb-primary', onclick: () => act('/join', { token }, `You joined ${p.title}.`).then(() => { location.hash = `parties/${id}`; }) }, 'Join'));
        else actions.append(el('button', { type: 'button', class: 'hb hb-primary', onclick: async () => {
          const note = el('textarea', { class: 'hi', id: 'pjNote', maxlength: '300', placeholder: 'Say hi, or why you’d like to come (optional)' });
          if (await dialog(`Ask to join ${p.title}`, [el('div', { class: 'h-stack' }, el('label', { class: 'sr-only', for: 'pjNote' }, 'Note'), note, el('p', { class: 'h-help' }, `${p.owner} sees your username and this note.`))], [['Cancel', 'hb-quiet', false], ['Send request', 'hb-primary', true]]))
            act('/requests', { note: note.value, token }, 'Request sent.'); } }, 'Ask to join'));
        return;
      }
      // Live watch: a member asks to join the host's watch (the host approves); the host invites members one by one.
      const partyHandOff = async (payload, okText) => {
        const v = await extVersion;
        if (!v) return needExtension('Watching together runs in the Herae extension for Chrome on a laptop or desktop. Add it (free) and sign in with this account.');
        if (payload.mode && !atLeast(v, '2.7.27')) return toast('This needs the newest Herae (2.7.27), which is on its way to the Chrome Web Store. Chrome updates it by itself within a day or so.');
        const ack = await handOff(payload);
        if (!ack.handled) return needExtension('Herae didn’t answer. Make sure it’s added to Chrome and you’re signed in with this account.');
        toast(ack.error || okText);
      };
      if (p.role !== 'owner' && p.hostWatching) actions.prepend(el('button', { type: 'button', class: 'hb hb-primary', onclick: () => partyHandOff({ target: p.owner, mode: 'join' }, `Asked ${p.owner} to let you in. When they do, Herae asks you to confirm — keep its window open.`) }, 'Join the watch'));
      if (p.role !== 'owner' && !p.hostWatching) actions.append(el('span', { class: 'muted', style: 'font-size:var(--h-size-sm)' }, `${p.owner} hasn’t started watching yet.`));
      if (p.role !== 'owner') actions.append(el('button', { type: 'button', class: 'hb hb-quiet', onclick: async () => {
        if (await dialog(`Leave ${p.title}?`, el('p', { class: 'muted' }, 'You can come back with the invite link while there’s room.'), [['Stay', 'hb-quiet', false], ['Leave', 'hb-danger', true]])) { await act('/leave'); location.hash = 'parties'; } } }, 'Leave party'));
      if (mod) {
        const link = `${location.origin}${location.pathname}#parties/${p.id}/${p.inviteToken}`;
        actions.prepend(el('button', { type: 'button', class: 'hb hb-primary', onclick: async () => { try { await navigator.clipboard.writeText(link); toast('Invite link copied. Anyone with it can join while there’s room.'); } catch (e) { prompt('Copy the invite link:', link); } } }, 'Copy invite link'));
        if (p.requests.length) {
          v.append(el('h2', {}, `Asking to join (${p.requests.length})`));
          const ul = el('ul', { class: 'h-list' });
          p.requests.forEach((q) => ul.append(el('li', {}, el('div', { class: 'row-main' }, el('strong', {}, q.username), q.note ? el('div', { class: 'sub' }, q.note) : null),
            el('button', { type: 'button', class: 'hb hb-quiet', onclick: () => requestChat(id, q.id, q.username) }, 'Chat'),
            el('button', { type: 'button', class: 'hb hb-primary', onclick: () => act(`/requests/${q.id}/approve`, null, `${q.username} is in.`) }, 'Let in'),
            el('button', { type: 'button', class: 'hb hb-quiet', onclick: () => act(`/requests/${q.id}/reject`) }, 'Decline'))));
          v.append(ul);
        }
      }
      if (p.role === 'owner') actions.append(el('button', { type: 'button', class: 'hb hb-secondary', onclick: () => editParty(p) }, 'Settings'));
      v.append(el('h2', { style: 'margin-top:var(--h-5)' }, 'Who’s in'));
      const ul = el('ul', { class: 'h-list' });
      const ROLE = { owner: 'Host', moderator: 'Moderator', member: '' };
      p.memberList.forEach((m) => {
        const items = [];
        if (m.username !== me) {
          if (p.role === 'owner') items.push(p.hostWatching
            ? ['Add to my watch', () => partyHandOff({ target: m.username, mode: 'add', title: p.title }, `Invited ${m.username} into your watch.`)]
            : ['Start watching with them', () => partyHandOff({ target: m.username, title: p.title }, `Inviting ${m.username}… Herae is opening for you.`)]);
          if (p.role === 'owner' && m.role !== 'owner') items.push([m.role === 'moderator' ? 'Remove as moderator' : 'Make moderator', () => act(`/moderators/${m.username}`, { moderator: m.role !== 'moderator' })]);
          if (mod && m.role !== 'owner' && (p.role === 'owner' || m.role === 'member')) items.push([`Remove from party`, async () => {
            if (await dialog(`Remove ${m.username}?`, el('p', { class: 'muted' }, 'They leave the party and can’t come back with the link or by asking.'), [['Cancel', 'hb-quiet', false], ['Remove', 'hb-danger', true]])) act(`/members/${m.username}/remove`, null, `${m.username} removed.`); }, true]);
          items.push(['Report', () => reportPerson(m.username)], ['Block', async () => { if (await blockPerson(m.username)) renderParty(id, token); }, true]);
        }
        ul.append(el('li', {}, el('div', { class: 'row-main' }, el('strong', {}, m.username), ROLE[m.role] ? el('div', { class: 'sub' }, ROLE[m.role]) : null), items.length ? moreMenu(items) : null));
      });
      v.append(ul);
    }
    // The short chat attached to one request to join (applicant ↔ host/moderators). Closes once the request is answered.
    async function requestChat(partyId, rid, withName) {
      const path = `/api/parties/${partyId}/requests/${rid}/messages`;
      for (;;) {
        let t; try { t = await apiRequest(path); } catch (e) { toast(e.message || 'This chat isn’t available.'); return; }
        const list = el('div', { class: 'c-thread', role: 'log', 'aria-label': `Messages with ${withName}`, style: 'max-height:40vh;overflow:auto' },
          t.messages.length ? t.messages.map((m) => el('div', { class: `c-msg${m.sender === me ? ' mine' : ''}` }, m.body, el('time', {}, `${m.sender === me ? 'You' : m.sender} · ${when(m.createdAt)}`)))
            : el('p', { class: 'muted' }, 'No messages yet.'));
        const box = t.open ? el('textarea', { class: 'hi', id: 'rqMsg', maxlength: '1000', placeholder: 'Write a message', 'aria-label': 'Message' }) : null;
        const res = await dialog(`About joining — ${withName}`, [el('div', { class: 'h-stack' }, list, box || el('p', { class: 'h-help' }, 'This request has been answered, so the chat is closed.'))],
          t.open ? [['Close', 'hb-quiet', false], ['Send', 'hb-primary', true]] : [['Close', 'hb-quiet', false]]);
        if (!res) return;
        if (!box.value.trim()) continue;
        try { await apiRequest(path, { method: 'POST', body: JSON.stringify({ body: box.value }) }); }
        catch (e) { toast(e.message || 'Could not send.'); }
      }
    }
    // Create (no argument) or edit (owner) a party.
    async function editParty(p = null) {
      const local = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      const t = el('input', { class: 'hi', id: 'ptTitle', maxlength: '80', placeholder: 'e.g. Friday horror night', value: p ? p.title : '' });
      const d = el('textarea', { class: 'hi', id: 'ptDesc', maxlength: '500', placeholder: 'What you’re watching, the vibe (optional)' }); if (p && p.description) d.value = p.description;
      const cap = el('input', { class: 'hi', id: 'ptCap', type: 'number', min: '2', max: '50', value: p ? p.capacity : 8 });
      const at = el('input', { class: 'hi', id: 'ptAt', type: 'datetime-local', value: p && p.startsAt ? local(new Date(p.startsAt.replace(' ', 'T') + 'Z')) : '' });
      const radio = (name, value, label, checked) => el('label', { class: 'h-row' }, el('input', { type: 'radio', name, value, checked }), ` ${label}`);
      const pub = p ? p.visibility === 'public' : false; const open = p ? p.admission === 'open' : false;
      const adm = el('fieldset', { style: 'border:0;padding:0', hidden: !pub }, el('legend', { class: 'h-label' }, 'Who gets in'),
        radio('ptAdm', 'request', 'People ask, you let them in', !open), radio('ptAdm', 'open', 'Anyone 18+ can join', open));
      const vis = el('fieldset', { style: 'border:0;padding:0' }, el('legend', { class: 'h-label' }, 'Who can find it'),
        radio('ptVis', 'private', 'Only people with the invite link', !pub), radio('ptVis', 'public', 'Listed in public parties (18+)', pub));
      vis.onchange = () => { adm.hidden = vis.querySelector('input:checked').value !== 'public'; };
      const rotate = p ? el('label', { class: 'h-row' }, el('input', { type: 'checkbox', id: 'ptRot', style: 'width:20px;height:20px;accent-color:var(--h-accent)' }), ' Make a new invite link (the old one stops working)') : null;
      const ok = await dialog(p ? 'Party settings' : 'Start a watch party', [el('div', { class: 'h-stack' },
        el('label', { class: 'h-label', for: 'ptTitle' }, 'Name'), t, el('label', { class: 'h-label', for: 'ptDesc' }, 'About (optional)'), d,
        el('label', { class: 'h-label', for: 'ptAt' }, 'When (optional)'), at, el('label', { class: 'h-label', for: 'ptCap' }, 'How many people, you included'), cap, vis, adm, rotate)],
        p ? [['End party', 'hb-danger', 'end'], ['Cancel', 'hb-quiet', false], ['Save', 'hb-primary', true]] : [['Cancel', 'hb-quiet', false], ['Create', 'hb-primary', true]]);
      if (!ok) return;
      if (ok === 'end') {
        if (await dialog(`End ${p.title}?`, el('p', { class: 'muted' }, 'Everyone loses access and the invite link stops working. This can’t be undone.'), [['Keep it', 'hb-quiet', false], ['End party', 'hb-danger', true]])) {
          try { await apiRequest(`/api/parties/${p.id}/end`, { method: 'POST' }); toast('Party ended.'); location.hash = 'parties'; } catch (e) { toast(e.message || 'Could not end the party.'); } }
        return;
      }
      const body = { title: t.value, description: d.value, capacity: Number(cap.value), starts_at: at.value ? new Date(at.value).toISOString() : null,
        visibility: vis.querySelector('input:checked').value, admission: adm.querySelector('input:checked').value };
      if (rotate && rotate.querySelector('input').checked) body.rotate_link = true;
      try {
        const r = await apiRequest(p ? `/api/parties/${p.id}` : '/api/parties', { method: p ? 'PATCH' : 'POST', body: JSON.stringify(body) });
        toast(p ? 'Saved.' : 'Party created. Copy the invite link to bring people in.');
        if (p) renderParty(p.id); else location.hash = `parties/${r.party.id}`;
      } catch (e) { toast(e.message || 'Could not save.'); }
    }

    async function refreshBadges() {
      try {
        const [c, f, m] = await Promise.all([apiRequest('/api/chats'), apiRequest('/api/contacts'), apiRequest('/api/discover/matches').catch(() => ({ matches: [] }))]);
        const set = (id, n) => { $(id).hidden = !n; $(id).textContent = n || ''; };
        set('b-chats', c.conversations.reduce((s, x) => s + (x.unread || 0), 0)); set('b-friends', f.incoming.length); set('b-matches', m.matches.filter((x) => x.isNew).length);
      } catch (e) { /* badges are a convenience */ }
    }
    route(); refreshBadges();
  })();
  </script>
