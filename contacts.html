<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="herae-memories-site" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herae Memories — Contacts</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand-link" href="memories.html" aria-label="Herae Memories — home">
      <img src="logo.png" alt="Herae" class="brand-logo">
      <span class="brand-sub">Your contacts</span>
    </a>
    <nav class="nav-links">
      <a href="memories.html" class="nav-link">Feed</a>
      <a href="contacts.html" class="nav-link nav-link-active">Contacts</a>
    </nav>
    <div class="topbar-right">
      <button class="btn btn-ghost" id="searchTrigger" aria-label="Search">🔍 Search</button>
      <span class="who" id="whoAmI"></span>
      <button class="btn btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="page-wrap page-wrap-narrow">
    <div class="page-title">Contacts</div>
    <div class="page-sub">Tap someone to open their profile and see what they've shared.</div>

    <!-- ONE card, not two. Adding by username and sharing a link are the same
         job — bringing someone in — so they belong in one unit; as separate
         equal-weight cards they competed with each other and between them ate
         half the first screen on a page that is really about the list below.
         The link is the quieter of the two: no card, no heading of its own,
         text buttons rather than a second primary. -->
    <div class="add-someone">
      <div class="add-someone-head">
        <div class="section-title" style="margin:0">Add someone</div>
        <div class="invite-count" id="inviteCount" hidden></div>
      </div>

      <form class="add-contact-row" id="addContactForm">
        <input type="text" id="addContactInput" placeholder="Their username" autocomplete="off" maxlength="64">
        <button type="submit" class="btn btn-primary" id="addContactBtn">Send request</button>
      </form>
      <div class="add-contact-msg" id="addContactMsg"></div>

      <div class="invite-inline" id="inviteCard" hidden>
        <div class="invite-inline-label">or send them your invite link — whoever opens it is connected to you</div>
        <div class="invite-inline-row">
          <code class="invite-link" id="inviteLink" title="Your permanent invite link"></code>
          <button type="button" class="invite-mini" id="inviteCopy">Copy</button>
          <button type="button" class="invite-mini" id="inviteShare" hidden>Share</button>
        </div>
      </div>
    </div>

    <div id="requests"></div>

    <div class="contacts-list-head">
      <div class="section-title" id="contactsHeading">Your contacts</div>
      <input type="text" id="contactSearch" class="contacts-search" placeholder="🔍 Search contacts…" autocomplete="off">
    </div>

    <div id="content">
      <div class="spinner-text">Loading contacts…</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script type="module" src="/src/pages/contacts.js"></script>
</body>
</html>
